[package]
name = "redextape-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The package is `redextape-cli`; the command a user types is `redextape`.
[[bin]]
name = "redextape"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
redextape-core = { path = "../redextape-core" }
clap = { version = "4", features = ["derive"] }
ariadne = "0.6"
similar = "3"

[dev-dependencies]
assert_cmd = "2"
trycmd = "1"
