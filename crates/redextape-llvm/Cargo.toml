[package]
name = "redextape-llvm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
ts = ["dep:ts-rs"]

[dependencies]
redextape-core = { path = "../redextape-core", features = ["serde"] }
# `ll` alone, the writer, which builds for wasm32 with neither LLVM nor Cranelift.
redextape-native = { path = "../redextape-native", default-features = false, features = ["ll"] }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
redextape-test-support = { path = "../redextape-test-support" }
serde_json = "1"
