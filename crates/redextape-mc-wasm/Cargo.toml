[package]
name = "redextape-mc-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cdylib` alone, for the reason `redextape-clif-wasm`'s manifest gives.
[lib]
crate-type = ["cdylib"]

[features]
# Exactly one is built into each package: `pkg-mc-x86-64/` with the default, `pkg-mc-arm64/` with
# `--no-default-features --features arm64`. `x86` is the default so that a `--workspace` build, which turns on no
# feature of its own, builds this crate as one of its packages.
default = ["x86"]
x86 = ["redextape-mc/x86"]
arm64 = ["redextape-mc/arm64"]

[dependencies]
redextape-mc = { path = "../redextape-mc" }
# For `Listing`. `clif` alone, since the JIT's default features do not build for wasm32.
redextape-native = { path = "../redextape-native", default-features = false, features = ["clif"] }
serde = "1"
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
