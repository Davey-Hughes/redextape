[package]
name = "redextape-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Optional on purpose: `redextape-core` must build for wasm32, which `scripts/check-all.sh`'s wasm leg
# checks on every gate run, and serde builds for wasm32. Optional and default-off keeps
# `cargo tree -p redextape-core --edges normal` listing only this crate in a default build.
#
# It is here rather than in a wrapper crate because §9.1's view models are CORE outputs.
serde = { version = "1", features = ["derive"], optional = true }
# Here so `web/src/types.ts` is not a hand-written copy of this crate's wire types: `ts-rs` derives
# generate the TypeScript from these declarations, which is the only arrangement in which a variant
# added here cannot reach the browser unhandled. Optional and default-off, so the browser build never
# sees it — and `scripts/check-all.sh` builds the `ts` configuration for wasm32 anyway rather than
# trusting that.
ts-rs = { version = "10", optional = true }

[features]
serde = ["dep:serde"]
# `ts` IMPLIES `serde` RATHER THAN STANDING BESIDE IT. The generated TypeScript describes what serde
# puts on the wire, so a `TS` derive on a type whose `Serialize` is compiled out would describe a
# shape nothing produces.
ts = ["dep:ts-rs", "serde"]

[dev-dependencies]
# Examples and tests only.
#
# THE RULE IS THE GATE, NOT AN EMPTY LIST. `redextape-core` must build for wasm32 — that is what
# "WASM-clean" means and what the browser build depends on. An empty `[dependencies]` would be
# SUFFICIENT for wasm32-cleanliness but not NECESSARY: serde builds for wasm32, and a proc-macro
# dependency cannot break a wasm32 build at all (it runs on the host). `scripts/check-all.sh`'s `wasm`
# leg runs `cargo check --target wasm32-unknown-unknown -p redextape-core --lib` on every gate run, so
# a dependency that breaks the browser build fails at the PR that adds it. Dependencies are
# admissible; the gate decides.
#
# WHAT THE GATE DOES NOT COVER: `--lib`, not `--all-targets`. The dev graph is NOT wasm32-clean —
# `--all-targets` fails on `wait-timeout` and `getrandom` via `proptest`. Nothing short of dropping
# `proptest` would fix that, and `--lib` is what a consumer builds.
#
# `mimalloc` is a dev-dependency for two independent reasons: `libmimalloc-sys` is C that does not
# build for wasm32, and a library must not choose a global allocator at all — that belongs to the
# final binary. See any probe's ALLOCATOR note for why it is here.
proptest = "1"
redextape-test-support = { path = "../redextape-test-support" }
serde_json = "1"

# Target-gated so `cargo test --target wasm32-*` does not try to build C.
#
# This TARGET GATE is not the wasm32 gate described above — it removes ONE breakage from the dev
# graph, the one that is C rather than Rust. It does not make that graph wasm32-clean, and the
# `--all-targets` limit recorded above is why: nothing short of dropping `proptest` would.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
