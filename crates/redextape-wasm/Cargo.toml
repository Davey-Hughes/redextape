[package]
name = "redextape-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `rlib` ALONGSIDE `cdylib` ON PURPOSE. `cdylib` is what wasm-pack links; `rlib` is what lets
# `cargo test` compile `session.rs` natively, which is where every branch in this crate lives. Without
# it the inner module could only be exercised in a browser, and `cargo llvm-cov` instruments the
# native build — the whole crate would land in the coverage denominator uncovered.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redextape-core = { path = "../redextape-core", features = ["serde"] }
# NOT IN §5.3'S TABLE, and it is not a new edge in the graph either: `serde-wasm-bindgen` already
# depends on it. It is named directly because `LambdaStatus`/`TmStatus` are declared in this crate and
# a `derive` needs the crate in scope. The alternative was assembling both objects field by field
# through `js_sys::Reflect` in `lib.rs`, which would move branching into the shell — the one thing
# §5.2 says the shell must not have.
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.103"
console_error_panic_hook = "0.1.7"
# Optional and default-off, exactly as in `redextape-core` — see that manifest for why the generated
# TypeScript replaces a hand-written copy. `wasm-pack` never enables this feature.
ts-rs = { version = "10", optional = true }

[features]
# Forwards to core's so `ts` is ONE switch: without it, a run that enabled the feature only here would
# compile derives for this crate's eight wire types and silently leave core's out of that run.
#
# IT IS LOAD-BEARING FOR IMPORTS NOW, AND `AsmStatus::cap` IS WHY. That field is an `Option<AsmCap>`, core's
# enum, so the generated `AsmStatus.ts` imports `./AsmCap` — and without core's `ts` switched on by this
# line `AsmCap` has no `TS` impl and this crate's `ts` build does not compile. Every other field across the
# eight types is `bool`, `String`, `Vec<String>`, `usize`, `u64`, the wasm-local `RunStatus` or
# `ReductionStatus`, or `NodeId` — each bare or under one `Option` — and `NodeId` is a transparent alias for
# `u32`, which inlines as a TypeScript `number`. An earlier version of this comment said no field named a
# core type yet, which was true until the asm leg.
ts = ["dep:ts-rs", "redextape-core/ts"]
# SWITCHES OFF THE SIZE CHECK IN `tm_scratch_with_caps` (`src/session.rs`), SO A TM SCRATCH PARSES TEXT OF ANY
# LENGTH. It exists for one caller: `web`'s `test:probe:tm-buffer` script, which builds this crate with it into
# `target/probe-tm-buffer-wasm/` for `web/tests/browser/tm-buffer-cost.test.ts`, and never into `pkg/`.
# `MAX_SCRATCH_TM_BYTES` is set from what a build costs on BOTH sides of it, and a build that refuses every longer
# file before parsing it can only price one side.
#
# A FEATURE RATHER THAN A PARAMETER, because no product caller chooses the ceiling, as none chooses the caps
# `tm_scratch_with_caps` takes. The ceiling's two tests in `session.rs` compile only without it; with it, one test
# there holds what it does instead, and `scripts/check-all.sh` gives it a clippy and test leg of its own so that
# test runs. No wasm build a gate or the app loads enables it.
probe-no-tm-scratch-ceiling = []
# `probe-no-tm-scratch-ceiling`'s twin for asm copies, and one thing more. It switches off the size check in
# `asm_scratch_with_caps` (`src/session.rs`), so an asm copy parses text of any length, for
# `web/tests/browser/asm-copy-cost.test.ts`, which prices a build on both sides of `MAX_SCRATCH_ASM_BYTES`; and it
# exports `asmScratchWithCaps`, so `web/tests/browser/asm-copy-memory.test.ts` can build a copy under `DEFAULT_CAPS`
# and under `COPY_CAPS` and read the worker's memory after each. Built by `web`'s `test:probe:asm-copy` script into
# `target/probe-asm-copy-wasm/`, never into `pkg/`; `scripts/check-all.sh` gives it a clippy and test leg.
probe-asm-copy = []

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

# `redextape-test-support` HOLDS THE DERIVE-SITE SCANNER `tests/ts_bindings.rs` RUNS, and it is behind
# a target gate for the same reason `redextape-core`'s `mimalloc` is: `wasm-pack test` builds this
# crate's dev-dependency graph for wasm32, and nothing in that graph may be able to break the browser
# leg. The gate this pulls in is `#![cfg(feature = "ts")]` and never compiled for wasm32 anyway, so the
# dependency has no business being in that graph at all. `default-features = false` drops `proptest`,
# which this crate does not use — the same opt-out `redextape-cli` takes.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
redextape-test-support = { path = "../redextape-test-support", default-features = false }
