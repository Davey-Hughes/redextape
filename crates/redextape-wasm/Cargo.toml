[package]
name = "redextape-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `rlib` ALONGSIDE `cdylib` ON PURPOSE. `cdylib` is what wasm-pack links; `rlib` is what lets
# `cargo test` compile `session.rs` natively, which is where every branch in this crate lives. Without
# it the inner module could only be exercised in a browser, and `cargo llvm-cov` instruments the
# native build — the whole crate would land in the coverage denominator uncovered.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
redextape-core = { path = "../redextape-core", features = ["serde"] }
redextape-wire = { path = "../redextape-wire" }
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.7"

[features]
# SWITCHES OFF THE SIZE CHECK IN `tm_scratch_with_caps` (`src/session.rs`), SO A TM SCRATCH PARSES TEXT OF ANY
# LENGTH. It exists for one caller: `web`'s `test:probe:tm-buffer` script, which builds this crate with it into
# `target/probe-tm-buffer-wasm/` for `web/tests/browser/tm-buffer-cost.test.ts`, and never into `pkg/`.
# `MAX_SCRATCH_TM_BYTES` is set from what a build costs on BOTH sides of it, and a build that refuses every longer
# file before parsing it can only price one side.
#
# A FEATURE RATHER THAN A PARAMETER, because no product caller chooses the ceiling, as none chooses the caps
# `tm_scratch_with_caps` takes. The ceiling's tests in `session.rs` compile only without it; with it, one test
# there holds what it does instead, and `scripts/check-all.sh` gives it a clippy and test leg of its own so that
# test runs. No wasm build a gate or the app loads enables it.
probe-no-tm-scratch-ceiling = []
# `probe-no-tm-scratch-ceiling`'s twin for rxm copies, and one thing more. It switches off the size check in
# `rxm_scratch_with_caps` (`src/session.rs`), so an rxm copy parses text of any length, for
# `web/tests/browser/rxm-copy-cost.test.ts`, which prices a build on both sides of `MAX_SCRATCH_RXM_BYTES`; and it
# exports `rxmScratchWithCaps`, so `web/tests/browser/rxm-copy-memory.test.ts` can build a copy under `DEFAULT_CAPS`
# and under `COPY_CAPS` and read the worker's memory after each. Built by `web`'s `test:probe:rxm-copy` script into
# `target/probe-rxm-copy-wasm/`, never into `pkg/`; `scripts/check-all.sh` gives it a clippy and test leg.
probe-rxm-copy = []

[dev-dependencies]
wasm-bindgen-test = "0.3.80"

# `defunc_mapped` STAYS A FUNCTION OF ITS OWN IN `pkg/`. `wasm-opt -O` inlines a function with one caller
# whatever its size, and each function from `defunc_mapped` up to the `compile` export has one, so without
# this the defunctionalizer lands inside the export. V8 tiers a hot function up whole, so the first compile in
# a fresh worker would share the CPU with a TurboFan job over all of it. `#[inline(never)]` cannot ask for
# this: it reaches LLVM, which keeps the function apart already. The pattern matches the path wasm-bindgen
# names the function by, whatever its crate hash, and must precede `-O`; one that matches nothing is no error.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--no-inline=*::tm::defunc::defunc_mapped", "-O"]
