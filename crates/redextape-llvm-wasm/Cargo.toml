[package]
name = "redextape-llvm-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# `cdylib` alone, for the reason `redextape-clif-wasm`'s manifest gives.
[lib]
crate-type = ["cdylib"]

[dependencies]
redextape-llvm = { path = "../redextape-llvm" }
serde = "1"
wasm-bindgen = "0.2.130"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
