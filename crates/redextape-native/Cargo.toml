[package]
name = "redextape-native"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"

[features]
default = ["cranelift"]
# `clif` builds CLIF with no ISA, for wasm32, so it leaves off `cranelift-codegen`'s default features, which are
# for compiling on a native host; `cranelift` turns each one back on, so the native build gets all of them.
clif = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:target-lexicon"]
# The runtime belongs to the two features that run code, whose JITs call its functions in this process and size
# their run thread's stack by it; the AOT links the staticlib `aot.rs` builds with a `cargo` run of its own. `clif`
# only builds CLIF, so a `clif` build that listed it would carry a dependency it never uses.
cranelift = ["clif", "cranelift-codegen/host-arch", "cranelift-codegen/std", "cranelift-codegen/unwind",
             "cranelift-codegen/timing", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-object",
             "dep:cranelift-native", "dep:redextape-native-rt"]
llvm = ["dep:inkwell", "dep:redextape-native-rt"]

[dependencies]
redextape-core = { path = "../redextape-core" }
redextape-native-rt = { path = "../redextape-native-rt", optional = true }
cranelift-jit = { version = "0.137.2", optional = true }
cranelift-module = { version = "0.137.2", optional = true }
cranelift-frontend = { version = "0.137.2", optional = true }
cranelift-codegen = { version = "0.137.2", optional = true, default-features = false }
cranelift-object = { version = "0.137.2", optional = true }
cranelift-native = { version = "0.137.2", optional = true }
inkwell = { version = "0.11", optional = true, features = ["llvm23-1"] }
target-lexicon = { version = "0.13.6", optional = true }

[dev-dependencies]
cranelift-codegen = { version = "0.137.2", features = ["x86", "arm64"] }
proptest = "1"
redextape-test-support = { path = "../redextape-test-support" }

[lints]
workspace = true
