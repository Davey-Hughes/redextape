[package]
name = "redextape-test-support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Default-on so `redextape-core` and `redextape-native`'s dev-dependency declarations (bare
# `{ path = "../redextape-test-support" }`, no `features = [...]`) get `arb_expr_over`. `redextape-cli`
# wants ONLY `ScratchDir`, and opts out with `default-features = false` on its own declaration — see
# that crate's `Cargo.toml`.
[features]
default = ["proptest"]
proptest = ["dep:proptest"]

[dependencies]
proptest = { version = "1", optional = true }

# `ts_derive_scan`'s NULLABILITY rule parses Rust rather than scanning it as text, and this is the
# parser. It is not optional and not behind the `proptest` feature, for the reason the doc of
# `assert_overrides_match_field_nullability` gives: a text scan of that rule is defeated by ordinary
# Rust, and every such defeat is a question about Rust's grammar, which is a closed and finite thing
# that `syn` already answers. The SIBLING scan in that module stays a text scan on purpose; its
# whitelist asks whether a line IS one exact string, which needs no grammar at all.
#
# WHERE THIS DOES AND DOES NOT REACH, stated per crate. `redextape-wasm` — the crate that actually
# builds to wasm — declares this crate under
# `[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]`, so nothing here enters its wasm32
# graph. `redextape-core`, `redextape-native`, `redextape-grammar-check` and `redextape-cli` declare
# it under a PLAIN `[dev-dependencies]`, so `syn` and `quote` are in their wasm32 dev graphs — and
# those graphs are already unbuildable for wasm32 (`wait-timeout`, through `proptest` or `assert_cmd`;
# the note above `proptest` in `redextape-core`'s own manifest records the first). What SHIPS is
# unaffected either way, because `wasm-pack build` compiles no dev-dependencies at all.
syn = { version = "2", features = ["full", "parsing", "printing", "visit"] }
quote = "1"
# For reading a `cfg_attr`'s predicate as opaque tokens rather than trying to parse it: `syn::Meta`
# cannot parse `cfg_attr(true, …)`, and a boolean predicate is stable Rust.
proc-macro2 = "1"
