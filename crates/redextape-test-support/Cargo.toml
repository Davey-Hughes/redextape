[package]
name = "redextape-test-support"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# Default-on so `redextape-core` and `redextape-native`'s existing dev-dependency declarations (bare
# `{ path = "../redextape-test-support" }`, no `features = [...]`) keep getting `arb_expr_over` exactly
# as before. `redextape-cli` is the one consumer that wants ONLY `ScratchDir`, and opts out with
# `default-features = false` on its own declaration — see that crate's `Cargo.toml`.
[features]
default = ["proptest"]
proptest = ["dep:proptest"]

[dependencies]
proptest = { version = "1", optional = true }
