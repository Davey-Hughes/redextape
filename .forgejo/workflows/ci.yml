# Forgejo Actions CI for Redextape (self-hosted runner on git.daveynet.xyz).
# Adapted from the ws-sim setup for a Rust -> WASM static site + CLI (no server process).
#
# The `detect` job checks what exists and gates the rest: the Rust jobs run when there is a
# Cargo.toml, and `web` (and the `docker` job behind it) when there is a web/package.json, SKIPPING
# cleanly (green) when there is not. It also decides docs-only runs: when every changed path is under
# docs/, the Rust and web jobs skip and `gate` does not require them. See docs/ for the design specs.
#
# Forgejo specifics (vs GitHub): actions come from the code.forgejo.org mirror, toolchains are
# installed as steps (no fat preinstalled image), the image is built with `docker buildx build
# --push` against the host daemon, and the registry is the Forgejo instance (auth via PAT secrets
# REGISTRY_USER / REGISTRY_TOKEN).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A DOCS-ONLY PUSH TO `main` MUST START NO RUN, NOT A SHORT ONE. A run it started would join the
    # `concurrency` group below and cancel a code merge's run still in progress, and being docs-only it
    # would skip the jobs and the image that run was for, so that code would go untested on `main` and
    # unpublished. `docs/**` and nothing wider: the same definition `scripts/ci-docs-only.sh` applies to
    # pull requests (`LICENSE.md` feeds the licence check). A `v*` tag is not affected: Forgejo's
    # `matchPushEvent` counts `paths`/`paths-ignore` as matched for any tag push, so a release always runs.
    paths-ignore: ["docs/**"]
  pull_request:
    # `edited` is load-bearing, not decoration. Forgejo has NO `ready_for_review` event — its drafts
    # are a `WIP:` title prefix — so taking a PR out of draft surfaces as `edited`. Without it the
    # full jobs would not run until the next push, which is a window in which a draft-scoped PR could
    # be merged having never had a full run. The cost is that editing a non-draft PR's title or body
    # also re-runs the full jobs; that is the cheaper mistake.
    types: [opened, synchronize, reopened, edited]
    # NO `paths-ignore` HERE, unlike `push` above, and that asymmetry is forced, not chosen. On
    # `pull_request`, a path filter that matches the WHOLE diff means the workflow never runs at all, so no
    # `ci / gate (pull_request)` status is ever posted. A required context with no status never passes,
    # and this repository has no bypass for that (`enable_push` is off), so a docs-only PR would be
    # unmergeable forever.
    #
    # Docs-only pull requests are decided inside the workflow instead: `detect` publishes `docs_only` from
    # `scripts/ci-docs-only.sh` (every changed path under docs/, failing closed), the Rust and web jobs
    # skip on it, and `gate` accepts that. A docs-only PR into `main` runs `detect`, `linear-history` and
    # `gate`. See docs/superpowers/specs/2026-10-27-docs-only-ci-design.md.
  workflow_dispatch:
  # WEEKLY, Sundays 10:00 UTC (03:00 PDT / 02:00 PST), because nothing else rebuilds `:latest` without a
  # merge; a dispatch rebuilds the same way. The full tier runs with it, because `docker` needs it. The
  # rest is above the `docker` job's "Build & push" step.
  schedule:
    - cron: "0 10 * * 0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-ONLY, and deliberately NOT beside `[profile.dev] debug` in the workspace manifest. Incremental
# compilation writes a per-crate dependency-graph cache that is dead weight on a runner (627 MB inside
# a 3.71 GB target tree) and compresses poorly, so it is paid on every cache upload AND on every
# restore — five times over each way, because the five cargo caches below are separate keys over
# separate copies of `target`.
#
# IT IS NOT FREE, which is why it is scoped here rather than set for everyone. On a WARM target tree
# with a one-file edit — the shape of a second push to an open PR, where the cache restored is this
# job's own — turning incremental off makes the rebuild slower. A runner pays the saved traffic on
# every job and the slower rebuild once; a laptop pays the slower rebuild many times an hour and never
# pays the traffic. Same setting, opposite answer.
#
# Job-level `env:` blocks (see `rust-llvm`) MERGE with this rather than replacing it — same-key wins
# at the more specific level, and `LLVM_SYS_221_PREFIX` shares no key with this.
env:
  CARGO_INCREMENTAL: "0"

# THE `v2` IN THE FIVE CARGO CACHE KEYS BELOW IS A GENERATION SALT, AND IT IS WHAT MAKES A PROFILE
# CHANGE TAKE EFFECT AT ALL. Those keys are `hashFiles('**/Cargo.lock')`, which a profile change does
# not move, so every one of them would hit EXACTLY — and on an exact primary-key hit the cache action
# skips saving altogether ("Cache hit occurred on the primary key ..., not saving cache", its own
# source). The old caches would survive indefinitely and the change would be inert, and silently so:
# every job still green.
#
# Waiting for the next Cargo.lock change would not fix it either. `restore-keys` would restore an old
# `target`, and cargo never garbage-collects that directory, so the following save would carry BOTH
# generations of artefacts — bigger, not smaller. The salt is part of the shared prefix precisely so the
# restore-keys miss the old caches too, rather than reintroducing what the primary key just excluded.
#
# Bump it only for a change that alters what `target` holds without altering Cargo.lock; the cost is
# one fully cold pipeline, where every job recompiles and re-fetches the registry.

jobs:
  # Detect what exists so each tier runs only when its files exist.
  #
  # `docs_only` is `true` when a pull request INTO `main` changes only paths under docs/
  # (`scripts/ci-docs-only.sh`). Every other run is `false` without asking:
  #   * A PR into another base: a green `gate` is stored on the head commit, not on the base, so a head
  #     docs-only against a branch holding untested code must not read green.
  #   * A push: a docs-only push to `main` starts no run (`on.push.paths-ignore`), so any push that does
  #     run changes more than docs — and a `v*` tag must publish its image either way.
  #   * The schedule or a dispatch, which each ask for a full run (the schedule is how `docker` rebuilds).
  # The self-test runs first, in the same step, so a broken classifier fails `detect`, which `gate`
  # requires before it trusts any output here.
  detect:
    runs-on: docker
    outputs:
      has_rust: ${{ steps.c.outputs.has_rust }}
      has_web: ${{ steps.c.outputs.has_web }}
      docs_only: ${{ steps.c.outputs.docs_only }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0               # the classifier diffs from the merge base, which needs the history
      - id: c
        env:                           # values via env, not inline ${{ }}, as the `docker` job passes them
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ -f Cargo.toml ]; then echo "has_rust=true" >> "$GITHUB_OUTPUT"; else echo "has_rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo "has_web=true" >> "$GITHUB_OUTPUT"; else echo "has_web=false" >> "$GITHUB_OUTPUT"; fi
          scripts/ci-docs-only.sh --self-test
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "${BASE_REF:-}" = main ]; then
            docs_only=$(scripts/ci-docs-only.sh "${PR_BASE:-none}" "${PR_HEAD:-none}")
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # LINEAR HISTORY on main. The local `merge.ff = only` that `scripts/setup-dev.sh` sets is a
  # convenience — it cannot bind anyone, and it does not survive a fresh clone. This is the gate: a
  # merge commit reaching main fails CI however it got there.
  #
  # Checks only the commits a push to `main` actually adds, so it never re-litigates history that is
  # already there. **The merge-commit step is scoped to pushes on `main` and does NOT run on
  # `pull_request`** — under a squash merge a branch's own shape never reaches main, so checking it
  # there would enforce a property main does not have. Since squash is the only enabled merge style and
  # `enable_push` is off, that step cannot fire at all: it is a tripwire against a settings regression
  # nothing in this repository could otherwise detect. Its own comment carries the settings.
  #
  # THE HYGIENE STEPS BELOW ARE UNCONDITIONAL AND ARE THE REASON `gate` REQUIRES THIS JOB ON PULL
  # REQUESTS; apart from the step that installs the Lua interpreter, they come in pairs, each a
  # self-test followed by its scan. They are what a PR needs from this job; the merge check is not.
  linear-history:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # IN THIS JOB RATHER THAN A NEW ONE, DELIBERATELY. `gate` aggregates a fixed `needs:` list and
      # re-derives each result by name, so a new job means editing three places and changing the set
      # of checks branch protection sees. This job already means "repo hygiene that needs a full
      # checkout and nothing else", already runs on every push and PR, and is already gated — so the
      # check lands enforced without moving any of that. `scripts/check-text-bytes.sh` is the same
      # script `.pre-commit-config.yaml` runs, per the convention `scripts/check-all.sh` states: the
      # local and CI gates cannot drift because there is one implementation. THE SELF-TEST RUNS
      # FIRST AND IS NOT CEREMONY: a scan that only ever runs against a passing tree cannot tell
      # working from broken. `--self-test` plants a NUL, asserts the detector fires, and asserts an
      # escaped `\x00` does not. It calls the same `violations_in` the scan does, so it cannot drift
      # into agreeing with a broken scan.
      - name: Prove the control-byte detector still detects
        run: scripts/check-text-bytes.sh --self-test
      - name: Reject control bytes in tracked text files
        run: scripts/check-text-bytes.sh
      # THE CITATION GATE RIDES IN THIS JOB FOR THE REASONS THE COMMENT ABOVE ALREADY GIVES: it is
      # repo hygiene needing a full checkout and nothing else, this job already runs on every push and
      # PR and `gate` already requires it, and a new job would mean editing `gate`'s `needs:` list
      # and changing the set of checks branch protection sees. It is unconditional and not skippable.
      # Same script as `.pre-commit-config.yaml` runs, so the local and CI gates cannot drift.
      # SELF-TEST FIRST, AND NOT AS CEREMONY. This gate's whole job is to report nothing on a tree
      # that already passes, so a green scan is indistinguishable from a broken detector. `--self-test`
      # plants citations and asserts they are caught — single and range, `.rs` and not, either case —
      # asserts a symbol citation is not flagged, asserts an escape-hatch marker is counted rather than
      # hidden, and asserts a tally that disagrees with `git ls-files` is rejected. All through the same
      # `citation_lines` the scan uses, so it cannot drift into agreeing with a broken scan.
      - name: Prove the citation detector still detects
        run: scripts/check-citations.sh --self-test
      - name: Reject file:line citations in tracked source
        run: scripts/check-citations.sh
      # THE ATTRIBUTION GATE RIDES HERE FOR THE REASONS ABOVE, and it is the citation gate's successor
      # rather than its neighbour: that one enforces CITE THE SYMBOL, and this one enforces that the
      # file named beside the symbol is the file that DECLARES it. Same script as
      # `.pre-commit-config.yaml` runs, so the local and CI gates cannot drift.
      # SELF-TEST FIRST. The checks enumerated here fall four ways, with the category each one
      # belongs to:
      #
      #   ONE POSITIVE CONTROL, which no other check can stand in for: a citation naming the defining
      #   file PASSES. Every other check asserts a rejection or a specific acceptance; without this one
      #   a gate that rejected everything would read green.
      #
      #   FOUR BLIND SPOTS A SCANNER OF THIS KIND HAS. A symbol present only in a COMMENT is not
      #   ownership; a symbol present only in a Rust RAW STRING is not ownership; a declaration
      #   sitting after an ODD RUN OF RUST LIFETIMES survives stripping; and the `sym()` form is
      #   MATCHED rather than skipped.
      #
      #   FOUR GUARDING HOLES THE DECLARATION RULE CLOSES — not holes it leaves open. A CALL AT
      #   STATEMENT POSITION is not a declaration, which is what a presence rule cannot tell from a
      #   declaration. A RE-EXPORT declares nothing, which is what catches a barrel. And TWO for the
      #   hole a declaration rule that reads a local binding as a declaration leaves open: a
      #   PATH-QUALIFIED citation is not satisfied by a local `let` binding of the bare name, asserted
      #   once directly against `symbol_declared_in` and once end-to-end through a written-out
      #   `` `binder.rs`'s `Builder::overflow` `` citation — the only check here that proves
      #   `ATTRIBUTION_RE` admits a `::` at all.
      #
      #   FOUR PROVING THE RULE DOES NOT REJECT SOMETHING VALID, a different job from guarding a hole.
      #   A `wasm_bindgen` `js_name` and an object-literal method ARE declarations; a BARE citation IS
      #   still satisfied by a local `let` binding, which three live sites citing `examples/tm_demo.rs`
      #   depend on and which is the constraint the qualified-versus-local split respects; and a
      #   cited CSS file falls back to the presence rule, asserted so the absence of a CSS extractor is
      #   a decision rather than an accident.
      #
      # All of these reach the tree through the same `strip_code` and `symbol_declared_in` the scan
      # uses, so the self-test cannot drift into agreeing with a broken scan.
      - name: Prove the attribution detector still detects
        run: scripts/check-attributions.sh --self-test
      - name: Reject symbol citations that name the wrong file
        run: scripts/check-attributions.sh
      # THE FIGURE GATE RIDES IN THIS JOB FOR THE REASONS THE TWO COMMENTS ABOVE ALREADY GIVE, and is
      # unscoped for a SHARPER version of the citation gate's reason. A README's figure goes stale
      # because a DIFFERENT file changed: adding one line to
      # `grammars/tree-sitter-redextape-lambda/grammar.js` falsifies that grammar's own README AND the
      # TM and asm ones, which cite λ's line count in a comparison. The file that goes wrong is never
      # the file being committed, so nothing keyed on changed paths would fire. Same script as
      # `.pre-commit-config.yaml` runs, so the local and CI gates cannot drift.
      # SELF-TEST FIRST. It asserts that digits, spelled-out words and a capitalised word all read;
      # that a claim split across a line wrap is still found; and that a missing, reworded or
      # ambiguous claim is REFUSED rather than skipped, which is the property that keeps a rewording
      # from silently disabling a row. Same `find_claim` and `derive` the scan uses, so it cannot
      # drift into agreeing with a broken scan.
      - name: Prove the figure detector still detects
        run: scripts/check-doc-figures.sh --self-test
      - name: Reject documented figures that no longer match the tree
        run: scripts/check-doc-figures.sh
      # THE SHARED-DOC GATE RIDES HERE FOR THE REASONS THE GATES ABOVE GIVE, and its failure mode is
      # the figure gate's: a region goes stale because a DIFFERENT file changed. The same prose is
      # copied into all four grammar READMEs, and a copy can drift unnoticed. No gate here could see
      # that: `check-doc-figures.sh` derives NUMBERS and has no opinion about prose.
      - name: Prove the shared-doc detector still detects
        run: scripts/check-shared-docs.sh --self-test
      - name: Reject shared doc regions that no longer match their source
        run: scripts/check-shared-docs.sh
      # THE COLOUR GATE RIDES IN THIS JOB FOR THE REASONS ABOVE: repo hygiene needing a checkout and
      # nothing else, already required, and no change to `gate`'s `needs:` list. Same script as the
      # pre-commit hook. Self-test first, because a scan of a clean tree proves nothing on its own.
      - name: Prove the colour detector still detects
        run: scripts/check-colours.sh --self-test
      - name: Reject colour literals outside the palette
        run: scripts/check-colours.sh
      - name: Prove the grammar .wasm detector still detects
        run: scripts/check-grammar-wasm.sh --self-test
      - name: Reject a committed grammar .wasm that no longer matches its parser.c or its recorded bytes
        run: scripts/check-grammar-wasm.sh
      # THE LUA GATE RIDES HERE FOR THE REASONS THE GATES ABOVE GIVE, but its subject is a file this
      # repository ships FOR ANOTHER PROGRAM TO RUN. Nothing in CI loads `plugin/redextape.lua`; only
      # an editor does, on a user's machine, where a syntax error is a stack trace at startup rather
      # than a red build.
      # THE SYMBOL CHECK IS WHY THIS IS A SCRIPT RATHER THAN A `luac -p`. Editors load a parser by the
      # C symbol `tree_sitter_<name>`, so a typo in that file's `GRAMMARS` table loads a DIFFERENT
      # language instead of failing — a wrong colour with no error anywhere.
      # THE RUNNER IMAGE HAS NO LUA AND NO NEOVIM: `catthehacker/ubuntu:act-latest` carries node, git
      # and curl, so `scripts/check-lua.sh` cannot rely on `nvim --headless`, which is absent here.
      # `lua5.4` from the distro archive rather than a pinned download like the tree-sitter and nextest
      # installs, because nothing depends on WHICH Lua reads the file — every implementation agrees on
      # what a syntax error is, and the script probes for whatever it finds and fails loudly if that is
      # nothing rather than quietly checking less than it does locally.
      - name: Install a Lua interpreter for the gate below
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends lua5.4
      - name: Prove the lua detector still detects
        run: scripts/check-lua.sh --self-test
      - name: Reject unparsable lua or parser names that disagree with the exported symbols
        run: scripts/check-lua.sh
      # ON PUSHES TO `main` ONLY, AND THE NARROWING IS THE POINT RATHER THAN A RELAXATION. This job's
      # heading states the goal exactly: "a merge commit REACHING MAIN fails CI however it got there."
      # Running it on `pull_request` would check a different artifact — the PR branch's own shape — which
      # under a squash merge never reaches main at all. The squash produces one commit whose parent is
      # main's tip, so a branch may carry any number of merge commits and main stays linear regardless.
      #
      # **THIS STEP IS A TRIPWIRE FOR A SETTINGS REGRESSION, NOT AN ACTIVE GATE — say so plainly
      # rather than let a future reader assume it is load-bearing.** As configured today it cannot
      # fire, and that is the intended state. The settings it rests on:
      #
      #   * Branch protection on `main`: `enable_push = false` with an EMPTY push whitelist. Nothing
      #     reaches `main` except a pull-request merge.
      #   * Merge styles: `allow_squash_merge` is the ONLY one enabled. `allow_merge_commits`,
      #     `allow_rebase`, `allow_rebase_explicit` and `allow_fast_forward_only_merge` are all off.
      #     A squash produces one commit whose parent is `main`'s tip, so it cannot be a merge commit.
      #
      # Those two facts together make a merge commit on `main` unreachable. The check is kept anyway
      # because **the coupling is invisible from inside the repository**: the guarantee lives in
      # Forgejo's settings, which no file here can see, and re-enabling `allow_fast_forward_only_merge`
      # in the web UI would silently restore the hole — a fast-forward lands a branch's commits
      # verbatim, and `main` is already an ancestor of every PR head. One `git log --merges` on pushes
      # to `main` is the whole cost of noticing that.
      #
      # It is the idiom `layout.ts`'s `splitLeaf` already uses for its own refusals: a backstop for a
      # caller that got there another way, labelled as a backstop rather than dressed up as the
      # mechanism. If this ever fires, the bug is in the repository settings, not in a branch.
      #
      # THE CONDITION NAMES `main` RATHER THAN RELYING ON `on.push.branches`. That list is `[main]`
      # today, so `github.event_name == 'push'` would be equivalent — and would silently stop being
      # equivalent the moment someone adds a branch to it. A `v*` tag push skips the step, correctly:
      # the tagged commit is already on `main`.
      #
      # The other steps in this job are unconditional and must stay that way. They include the
      # control-byte gate, which has nothing to do with merge shape and everything to do with a control
      # byte that makes a whole source file invisible to `rg`.
      - name: Reject merge commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # A push compares against what the branch was before it. A first push (or a null base) has no
          # meaningful range, so fall back to the last commit.
          range=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "checking $range"
          merges=$(git log --merges --format='%h %s' "$range" || true)
          if [ -n "$merges" ]; then
            echo "error: merge commit(s) reached main — squash-merge the PR instead:" >&2
            echo "$merges" >&2
            exit 1
          fi
          echo "no merge commits in $range"

  # DRAFT pull requests only. Explicitly NOT a gate — the moment the PR leaves draft, the full-tier
  # jobs run on every push and this job stops.
  #
  # A DOCS-ONLY DRAFT INTO `main` IS THE EXCEPTION: this job skips with the others (`docs_only`), and
  # `gate` passes it, since the full tier would not be required out of draft either. Forgejo's `WIP:`
  # title still blocks its merge.
  #
  # It cannot scope against the PUSH INCREMENT:
  # `github.event.before` is EMPTY on Forgejo's `synchronize`, and `base.sha` is the merge-base with
  # `main`, so the payload offers no per-push increment at all — `check-scoped.sh` always takes its
  # whole-branch fallback.
  #
  # What it buys instead is cost: ~6 CPU-minutes instead of ~12, and 3-5 wall-clock minutes on a draft
  # push. What it does not buy is a narrower diff. Restoring genuine per-push scoping would mean
  # querying the previous run's head SHA from the API — considered and rejected as too much machinery,
  # and a new network failure mode, for a job that is explicitly non-gating.
  #
  # The DRAFT BOOLEAN, not a `full-ci` label, decides. A label does not follow the head commit: push
  # after labelling and it still reads green while the full run describes an older tree — a run that
  # covers less than it claims. `draft` cannot go stale, because leaving draft makes the full jobs run
  # on every subsequent push.
  rust-scoped:
    needs: detect
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.docs_only != 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0     # check-scoped.sh needs merge-base for its fallback
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown   # check-scoped.sh escalates to check-all.sh, which has a base-tier wasm leg
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      # check-scoped.sh's default-deny arm escalates any path it does not recognise to
      # `check-all.sh --no-llvm --no-browser` (see that script's header) — and the top-level
      # `grammars/` directory does not match its docs/tests/examples/benches cases, so it certainly
      # escalates. That base tier has a grammar leg, which ensure_treesitter hard-fails without.
      # Installed unconditionally here for the same reason cargo-nextest above is: this job cannot
      # know before running the script whether it will escalate.
      - name: Install tree-sitter CLI (pinned + checksummed, scripts/check-all.sh's grammar leg)
        run: ./scripts/install-treesitter-ci.sh
      # Falls back to any other job's `cargo-v2-` cache, so a scoped run on a fresh branch starts warm
      # rather than compiling the workspace from scratch to run one test binary.
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-scoped-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-v2-scoped-
            cargo-v2-
      - name: Scoped check (NOT the merge gate)
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # `BEFORE` is ALWAYS empty here, so this always expands to the literal `none..<sha>`, whose
          # base does not resolve, and the script always takes its whole-branch fallback. That is safe
          # (it checks MORE) and it is what the job header above says it delivers. The
          # `${BEFORE:-none}` form is kept rather than simplified so that a future Forgejo which DOES
          # populate `before` starts scoping narrowly with no edit here — the same auto-activate shape
          # `detect` uses for `web`.
          ./scripts/check-scoped.sh "${BEFORE:-none}..${SHA}"

  rust:
    needs: detect
    # Non-draft PRs, pushes, the schedule and dispatches. A DRAFT PR gets `rust-scoped` instead — see that
    # job for why the draft boolean rather than a label decides. Note this runs on EVERY push to a
    # non-draft PR, so a green full run always describes the head commit.
    #
    # IF FORGEJO EVER OMITS `draft`, THIS FAILS SAFE — worth stating because it is not obvious and nothing
    # else here says it. `null` is falsy, so `!github.event.pull_request.draft` is `true` and every
    # full-tier job RUNS; `rust-scoped`'s trailing `&& ...draft` yields `null`, which coerces to false,
    # so the only thing skipped is the non-gating job. The ambiguous case over-runs rather than under-runs.
    # The `||` also short-circuits before `.draft` is touched at all on `push`, `schedule` and
    # `workflow_dispatch`.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker                    # -> catthehacker/ubuntu:act-latest (node+git+curl)
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml) + coverage tooling
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show                        # installs the toolchain + rustfmt/clippy from rust-toolchain.toml
          rustup target add wasm32-unknown-unknown   # scripts/check-all.sh's wasm leg checks against it
          rustup component add llvm-tools-preview
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C "$HOME/.cargo/bin"
      # cargo-nextest is the runner scripts/check-all.sh requires. Prebuilt binary, same pattern as
      # cargo-llvm-cov above — building it from source would cost more than it saves. The pin and
      # its checksum live in the script, which `rust-llvm` runs too: both jobs invoke check-all.sh,
      # so both need the same runner.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      # This job runs check-all.sh --no-llvm --no-browser (below), whose base tier has a grammar leg
      # that ensure_treesitter hard-fails without. Pinned to v0.25.10, NOT the newest numbered
      # release — see scripts/install-treesitter-ci.sh for why that (not v0.26.12) is what reproduces
      # the committed grammar on this runner.
      - name: Install tree-sitter CLI (pinned + checksummed, scripts/check-all.sh's grammar leg)
        run: ./scripts/install-treesitter-ci.sh
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v2-
      # BOTH opt-outs, not just --no-llvm. A bare --no-llvm runs the browser tier too — which would make
      # this job the only one needing Chrome while `rust-browser` below already installs it. Same
      # union-invariant split as LLVM, one tier wider.
      - name: Feature matrix (non-LLVM, non-browser configs)
        run: ./scripts/check-all.sh --no-llvm --no-browser
      # `llvm-cov nextest`, not `llvm-cov --all-targets`, for the same reason the gate above uses nextest.
      #
      # It is NOT bit-identical coverage: `--all-targets` instruments example targets and nextest's
      # default does not, so the two report slightly different line totals.
      #
      # Neither runner covers DOCTESTS: `--all-targets` excludes them and nextest cannot run them at
      # all, and `cargo llvm-cov --doctests` is nightly-only. The doctest in `ty::show` is EXECUTED by
      # scripts/check-all.sh above, just not instrumented here.
      #
      # 90 IS CHOSEN, NOT DERIVED, and saying so is the point of this comment. The tree measured
      # 95.64% lines; a floor at `floor(measured) - 1` would be 94, and 90 was picked over that
      # deliberately, to leave room for the workspace to take on hard-to-cover surface — a new
      # backend, platform-conditional code — without a floor bump in every such PR.
      #
      # The five points of headroom are a deliberate trade, not an oversight.
      - name: Test + coverage
        run: cargo llvm-cov nextest --workspace --fail-under-lines 90

  # The SLOW test tier: exhaustive sweeps marked `#[ignore = "slow tier: ..."]`, which `cargo test`
  # skips by default. In its own job for the same reason as `rust-llvm` — a multi-minute sweep must
  # never delay the fast signal — and NOT continue-on-error, because a job permitted to fail is not
  # coverage.
  #
  # This job is why the tier is worth having at all: `#[ignore]` tests rot when nothing runs them, and
  # the whole point of the tier is that developers do not run it locally on every commit.
  rust-slow:
    needs: detect
    # Non-draft PRs, pushes, the schedule and dispatches. A DRAFT PR gets `rust-scoped` instead — see that
    # job for why the draft boolean rather than a label decides. Note this runs on EVERY push to a
    # non-draft PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-slow-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v2-slow-
      - name: Slow tier (exhaustive sweeps)
        run: ./scripts/check-slow.sh

  # The LLVM backend, in its own job so a cold or upstream-broken LLVM install never delays the fast
  # default-feature signal from `rust`. Deliberately NOT continue-on-error: a job permitted to fail
  # is not coverage.
  #
  # Caches /var/cache/apt/archives (the downloaded .deb payloads), NOT /usr/lib/llvm-22 itself, and
  # the install step always runs. `llvm-config` dynamically NEEDs (`objdump -p`) libz3.so.4 and
  # libzstd.so.1, which come from the separate libz3-4/libzstd1 packages that dpkg installs to
  # /usr/lib/x86_64-linux-gnu/, outside /usr/lib/llvm-22. A directory-only cache that skips the whole
  # install step on a hit would restore an llvm-config that can't even execute (missing shared libs)
  # on every run after the first, on a fresh per-job container that never retains apt state. Caching
  # the apt archive instead keeps `apt-get install` unconditional and idempotent (so the runtime deps
  # are always registered) while still skipping the network download once the archive cache is warm.
  rust-llvm:
    needs: detect
    # Non-draft PRs, pushes, the schedule and dispatches. A DRAFT PR gets `rust-scoped` instead — see that
    # job for why the draft boolean rather than a label decides. Note this runs on EVERY push to a
    # non-draft PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      # This job runs check-all.sh (below) WITHOUT --no-llvm, and that gate hard-fails when
      # cargo-nextest is missing. The cargo-llvm-* cache does not cover ~/.cargo/bin, so the install
      # has to happen in this job.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      - name: Cache the LLVM 22 apt archive (avoids re-downloading ~300MB of .debs)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          # NO `runner.os` IN THE KEY, AND A restore-keys FALLBACK. `runner.os` is a CONSTANT in this
          # repository (every job is `runs-on: docker`), so it discriminates nothing while adding a
          # component the runner can change underneath us: if its value moves, the key moves with it
          # and the previous cache becomes unreachable. `restore-keys` is the prefix fallback that
          # softens exactly that.
          key: apt-llvm-22
          restore-keys: apt-llvm-22
      - name: Install LLVM 22 (unconditional — apt skips re-downloading cached .debs, but always installs)
        run: |
          # WITHOUT THIS THE CACHE STEP ABOVE SAVES AN EMPTY DIRECTORY. Debian/Ubuntu container
          # images ship /etc/apt/apt.conf.d/docker-clean, whose DPkg::Post-Invoke deletes every .deb
          # from /var/cache/apt/archives the moment install finishes, leaving the post-job save
          # nothing to store.
          #
          # A CACHE HIT DOES NOT MEAN THE CACHE HAD CONTENTS: an empty archive restores as a hit and
          # saves no download at all. These two lines make the archive actually non-empty; the cache
          # key above is what makes it findable.
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get update && apt-get install -y --no-install-recommends lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22
          # `llvm.sh` does not install Polly, but LLVM 22 is BUILT with it — so `llvm-config
          # --libnames`, which llvm-sys's build script reads, lists Polly and llvm-sys emits
          # `cargo:rustc-link-lib=static=Polly`. Without the separate dev package the link fails with
          # "could not find native static library `Polly`". This does not reproduce on macOS, where
          # Homebrew's keg and its own llvm-config agree.
          apt-get install -y --no-install-recommends libpolly-22-dev
          "$LLVM_SYS_221_PREFIX/bin/llvm-config" --version   # fail loudly on a version mismatch
          # Prove the libraries llvm-config advertises are actually present, rather than discovering
          # it during a link several minutes later.
          for lib in $("$LLVM_SYS_221_PREFIX/bin/llvm-config" --libnames); do
            find "$LLVM_SYS_221_PREFIX/lib" /usr/lib -name "$lib" -print -quit | grep -q . \
              || { echo "llvm-config advertises $lib but it is not installed"; exit 1; }
          done
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-llvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v2-llvm-
      # --llvm-only, NOT the bare invocation. Bare `check-all.sh` is `--no-llvm` plus the LLVM configs
      # by construction, so it would re-run every non-LLVM config the `rust` job has already run, at
      # 50.1s warm (`T_llvm_repeat`). That cost is not compilation: warm, the repeated legs cost
      # fingerprint-checking every crate plus re-running the whole test suite. See
      # docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §2.2(a).
      #
      # The union invariant in check-all.sh is what makes splitting the job safe: --no-llvm there
      # plus --llvm-only here still covers every config, checkable with `check-all.sh --list`.
      - name: Feature matrix (LLVM configs only — `rust` covers the rest)
        run: ./scripts/check-all.sh --llvm-only
      - name: Optimization report (informational, never gating)
        run: cargo run --release --example opt_report -p redextape-native --features llvm

  # THE BROWSER TIER, and it covers the one thing no other job in this workflow can reach.
  #
  # `rust`'s wasm legs prove the crates BUILD for wasm32. They cannot prove the boundary WORKS:
  # `#[wasm_bindgen]`'s generated glue and `serde-wasm-bindgen`'s marshalling only execute in a
  # browser, and `redextape-wasm` is deliberately structured so that every branch lives in
  # `session.rs` and is tested natively — which means a wasm-bindgen or serde-wasm-bindgen bump can
  # change what actually crosses the boundary with every other job in this file green. The wire shape
  # `web/` codes against is asserted here and nowhere else.
  #
  # NOT continue-on-error, for the same reason `rust-slow` is not: a job permitted to fail is not
  # coverage. Its own cache key, like `rust-llvm`, so it does not evict the `rust` job's.
  #
  # `gate` REQUIRES THIS UNDER has_rust, NOT has_web, and that is permanent rather than provisional.
  # The boundary under test belongs to `redextape-wasm`; `web/` is a CONSUMER of it. Tying the job to
  # has_web would leave the boundary unguarded for exactly as long as it has no consumer — the window
  # in which it is easiest to break unnoticed — and a consumer arriving would not change which crate
  # owns the thing being tested. So this is not a gate to "update later" in that direction.
  #
  # WHAT WOULD LEGITIMATELY CHANGE IT IS COST, NOT CORRECTNESS. `has_rust` is `[ -f Cargo.toml ]`, so
  # it is true on every run here — an auto-activate switch, not a filter — and this job therefore runs
  # for changes that cannot possibly affect the boundary. The successor is the path-gated `detect`
  # output already deferred in this file's `pull_request` comment above.
  #
  # WHEN THAT LANDS, THE OBVIOUS PATH SET IS WRONG AND WOULD GUT THIS JOB. Scoping it to
  # `crates/redextape-wasm/**` misses what it primarily exists to catch: a wasm-bindgen or
  # serde-wasm-bindgen bump changing what actually crosses, which shows up in **`Cargo.lock`** and
  # nowhere else. `.cargo/config.toml` belongs in the set too — it carries the 8 MiB shadow-stack link
  # arg the depth cases were calibrated against — as does `crates/redextape-core/**`, since the view
  # models that cross the boundary are defined there rather than here.
  #
  # Caches /var/cache/apt/archives rather than the installed Chrome, and keeps `apt-get install`
  # unconditional — the same reasoning `rust-llvm` documents above: a directory cache that skips the
  # install would leave the shared libraries dpkg registers outside that directory missing on every
  # run after the first.
  rust-browser:
    needs: detect
    # Non-draft PRs, pushes, the schedule and dispatches — matching the other full-tier jobs. A DRAFT PR
    # gets `rust-scoped` instead.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.docs_only != 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml) + the wasm32 target
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown
      # NO cargo-nextest here, and that is deliberate rather than an omission: `--browser-only`
      # selects no `test` legs, so check-all.sh does not demand the runner. `rust` and `rust-llvm`
      # both install it because their tiers do have `test` rows.
      - name: Install wasm-pack (the browser leg drives the boundary through it)
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xzf - --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version
      - name: Cache the Chrome apt archive (avoids re-downloading the .deb every run)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          # No `runner.os`, plus a restore-keys prefix, as in the identical block in `rust-llvm`:
          # it is constant here, and a key with a volatile component and no fallback stops matching
          # the earlier cache the moment that component changes.
          key: apt-chrome
          restore-keys: apt-chrome
      # GOOGLE CHROME SPECIFICALLY, not chromium. wasm-pack fetches a chromedriver matched to Chrome,
      # and this is also the browser the boundary's depth figures were measured against — a different
      # engine would be a different measurement wearing the same test's name.
      #
      # `google-chrome-stable` is the binary name the .deb installs, and check-all.sh's
      # `ensure_browser` probes that exact path: wasm-pack itself only looks for `google-chrome`,
      # which is the naming trap the script exists to absorb.
      - name: Install Google Chrome (unconditional — apt skips re-downloading a cached .deb)
        run: |
          # Keep the downloaded .debs so the cache step above has something to save — see the
          # identical block in `rust-llvm` for why: the base image's docker-clean deletes them
          # post-install, which leaves the archive cache an empty hit on every run.
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get update && apt-get install -y --no-install-recommends wget gnupg ca-certificates
          install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list
          apt-get update && apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome-stable --version   # fail loudly here rather than inside wasm-pack
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-v2-browser-
      # Chrome runs as root in this container, which it refuses to do sandboxed, and the container's
      # /dev/shm is too small for it. Both are handled by `crates/redextape-wasm/webdriver.json`
      # (`goog:chromeOptions.args`), which wasm-bindgen-test reads from the crate root — so this step
      # is the bare invocation, and the flags live with the crate they apply to rather than here.
      - name: Browser tier (the wasm boundary, in headless Chrome)
        run: ./scripts/check-all.sh --browser-only

  # THE ONE REQUIRED STATUS CHECK. Nothing else in this workflow should be one.
  #
  # FORGEJO REPORTS A SKIPPED JOB AS `success` ON THE COMMIT-STATUS API. When the draft gating skips
  # `rust`, `rust-slow`, `rust-llvm` and `rust-browser`, each publishes `success` having never run, so
  # a pull request on which none of them ran reads `success`. A required context naming those jobs
  # directly therefore cannot distinguish "ran and passed" from "did not run" — on ANY pull request,
  # draft or not. A `detect` emitting `has_rust=false` would do the same thing on a non-draft PR.
  #
  # `needs.<job>.result` IS A DIFFERENT SUBSYSTEM AND IT DOES MAKE THAT DISTINCTION — it reports
  # `skipped` as `skipped`. The `docker` job below relies on that. This job is the bridge: it reads
  # the internal results and publishes ONE external context that a skip cannot fake.
  #
  # `if: always()` IS LOAD-BEARING, NOT DEFENSIVE. Without it this job would itself be skipped
  # whenever its `needs` were skipped, and a skipped `gate` publishes `success` — reproducing the
  # exact hole it exists to close, one level up.
  #
  # See docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §4.4.
  gate:
    needs: [detect, linear-history, rust, rust-slow, rust-llvm, rust-browser, web]
    if: always()
    runs-on: docker
    steps:
      - name: Every gating job must have actually run and succeeded
        env:
          R_DETECT: ${{ needs.detect.result }}
          R_LINEAR: ${{ needs.linear-history.result }}
          R_RUST: ${{ needs.rust.result }}
          R_SLOW: ${{ needs.rust-slow.result }}
          R_LLVM: ${{ needs.rust-llvm.result }}
          R_BROWSER: ${{ needs.rust-browser.result }}
          # Every `R_*` here must be set: under `set -u` an unbound one is a hard failure before any
          # `require` runs, so a dropped variable turns the gate red and blocks the merge rather than
          # quietly evaluating that job as not-success, which is what an unset-but-tolerated variable
          # would do.
          R_WEB: ${{ needs.web.result }}
          HAS_RUST: ${{ needs.detect.outputs.has_rust }}
          HAS_WEB: ${{ needs.detect.outputs.has_web }}
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
        run: |
          set -eu
          echo "detect=$R_DETECT linear-history=$R_LINEAR has_rust=$HAS_RUST has_web=$HAS_WEB docs_only=$DOCS_ONLY"
          echo "rust=$R_RUST rust-slow=$R_SLOW rust-llvm=$R_LLVM rust-browser=$R_BROWSER web=$R_WEB"

          fail=0
          require() {
            [ "$2" = success ] || { echo "error: $1 did not succeed — result: $2" >&2; fail=1; }
          }

          # `detect` is checked FIRST and unconditionally. Its outputs decide what else is required,
          # so trusting them while it was failing or skipped would make every check below vacuous.
          require detect "$R_DETECT"
          require linear-history "$R_LINEAR"

          # `docs_only` comes from `detect`, already required above, and must be exactly `true` or `false`: any
          # other value fails here rather than being read as either. `true` is sound to trust: the classifier
          # fails closed and its self-test ran in the same step, so a broken one fails `detect`, not this check.
          # Nothing the Rust and web jobs run reads docs/, so on a docs-only change they would test the merge
          # base's code again (docs/superpowers/specs/2026-10-27-docs-only-ci-design.md).
          case "$DOCS_ONLY" in
            true|false) ;;
            *) echo "error: detect's docs_only is '$DOCS_ONLY', expected true or false" >&2; fail=1 ;;
          esac

          if [ "$DOCS_ONLY" = true ]; then
            echo "docs-only change (every path under docs/): the Rust and web tiers are not required"
          else
            # Only demand a tier when `detect` says there is something to build — the same "run only when it
            # exists" contract `detect` gives the rest of the workflow. `detect` is already required above, so
            # an EMPTY (unset) HAS_RUST/HAS_WEB can only mean a real absence, never a swallowed failure. That
            # claim is about emptiness, not about `false`: an explicit `false` is a normal, legitimate value
            # and is exactly what the `else` branches below are for — it is not the case the claim covers.
            if [ "$HAS_RUST" = true ]; then
              require rust "$R_RUST"
              require rust-slow "$R_SLOW"
              require rust-llvm "$R_LLVM"
              # Gated on has_rust rather than has_web on purpose: the browser tier tests the RUST
              # crate's wasm boundary, which exists whether or not `web/` does. Tying it to has_web
              # would leave the boundary ungated for exactly as long as it has no consumer — the
              # window in which it is easiest to break unnoticed.
              require rust-browser "$R_BROWSER"
            else
              echo "detect reports no Rust — the Rust tier is not required on this run"
            fi

            # `web` is required whenever `detect` reports it — this is what makes its running actually
            # gate anything instead of silently leaving a failing `web` job out of a green `gate`.
            if [ "$HAS_WEB" = true ]; then
              require web "$R_WEB"
            else
              echo "detect reports no web — the web tier is not required on this run"
            fi
          fi

          if [ "$fail" -ne 0 ]; then
            echo >&2
            echo "THIS is the required check, not the jobs above it. A job that was SKIPPED" >&2
            echo "publishes 'success' to the status API, so requiring those directly would let a" >&2
            echo "draft PR — or any run where they were skipped — read green having never run." >&2
            echo "A draft PR is EXPECTED to fail here, unless it is docs-only into main: take it out" >&2
            echo "of draft to run the full tier." >&2
            exit 1
          fi
          echo "all gating jobs ran and passed"

  web:
    needs: detect
    if: needs.detect.outputs.has_web == 'true' && needs.detect.outputs.docs_only != 'true'
    runs-on: docker
    container:
      image: node:26-bookworm          # node + git present; JS actions work
    defaults:
      run:
        working-directory: web
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust + wasm-pack (the web build compiles the core crate to WASM)
        working-directory: ${{ github.workspace }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xzf - --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
      - name: Install pnpm
        run: npm install -g pnpm@11.20.0
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build the WASM package (its .d.ts is what typecheck resolves `../pkg` against)
        run: pnpm run build:wasm
      - name: Build the LSP WASM package (same reason, for `../../pkg-lsp` in lsp-worker.ts)
        run: pnpm run build:lsp-wasm
      - name: Generate the wire-type bindings (web/bindings is gitignored; typecheck resolves against it)
        run: pnpm run build:bindings
      # THE LICENCES PAGE'S LIST, REGENERATED AND COMPARED. In this job and not with the hygiene scans in
      # `linear-history`, because this is the job with both `node_modules` and cargo, which the generator reads.
      - name: Third-party licences match what the site ships (self-test)
        run: ../scripts/check-licences.sh --self-test
      - name: Third-party licences match what the site ships
        run: ../scripts/check-licences.sh
      - name: Install the Chromium Playwright needs
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint + format check
        run: pnpm exec biome ci --error-on-warnings
      - name: Typecheck
        run: pnpm run typecheck
      # `test:coverage`, not `test` — this is the web coverage gate. Thresholds live in
      # web/vite.config.ts, whose comment names the roadmap entries that hold their measurements.
      # NO SEPARATE JOB AND NO `gate` EDIT IS NEEDED: `gate` already lists `web` in `needs` and already
      # requires it under has_web, so a threshold failure fails this job, which fails the required
      # check. A separate coverage job would re-install Rust, wasm-pack and Chromium for a signal this
      # job already carries, and would add a `require` line to `gate` that could be forgotten.
      - name: Unit tests + coverage gate
        run: pnpm run test:coverage
      - name: Build the app
        run: pnpm run build:app

  # Build + push the static-site image — only after rust + web pass, never on a PR.
  docker:
    needs: [detect, rust, rust-llvm, rust-slow, web]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.has_web == 'true'
      && needs.rust.result == 'success'
      && needs.rust-llvm.result == 'success'
      && needs.rust-slow.result == 'success'
      && needs.web.result == 'success'
    runs-on: docker                    # -> catthehacker/ubuntu:act-latest + the host docker socket the runner mounts
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the docker CLI + buildx plugin
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.daveynet.xyz -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      # Build in an isolated docker-container builder, NOT the daemon's default driver, so CI never
      # touches the host image store. Building on the default driver would tag the new image into the
      # runner's own store, so the host's local `:latest` moves without anything being pulled — and any
      # deployment watching that tag then sees no change to act on. The named builder persists its
      # BuildKit cache across runs; `buildx create` isn't idempotent, so drop any stale container by
      # name first (`docker rm`, NOT `docker buildx rm`, which would also delete the cache volume).
      #
      # THE NAME MUST STAY UNIQUE PER REPO. ws-sim also builds on this runner and the `docker rm -f`
      # below is unconditional, so with a shared builder name whichever `docker` job starts second
      # would destroy the builder the first is mid-build in.
      - name: Set up an isolated buildx builder (keeps CI out of the host image store)
        run: |
          docker rm -f buildx_buildkit_redextape-builder0 >/dev/null 2>&1 || true
          docker buildx create --name redextape-builder --driver docker-container --use
      - name: Compute tags
        id: t
        env:                       # values via env, not inline ${{ }}, so a crafted ref name can't inject shell
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMG="forge.daveynet.xyz/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMG:sha-$(echo "$SHA" | cut -c1-7)"
          [ "$REF" = 'refs/heads/main' ] && TAGS="$TAGS,$IMG:latest"
          case "$REF" in
            refs/tags/v*) V="$REF_NAME"; TAGS="$TAGS,$IMG:${V#v}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # No registry cache export: Forgejo behind Cloudflare rejects large mode=max blobs (413). The
      # persistent redextape-builder keeps a local BuildKit cache instead — warm across runs. provenance
      # /sbom OFF so Forgejo registers a plain manifest. --push ships every tag in one pass.
      #
      # A REFRESH (THE SCHEDULE OR A DISPATCH) IS A PLAIN REBUILD, WITH NO EXTRA FLAG. The schedule exists
      # because nothing rebuilds `:latest` without a merge. The docker-container builder set up above
      # resolves each FROM tag against the registry on every build, so a rebuild picks up whichever base
      # moved — `nginx:alpine` and the bases of the `wasm` and `web` stages alike — and the shipped
      # `runtime` stage installs nothing a cache could hold back. A refresh pushes the tags a push of its
      # ref would: on `main` the commit's `sha-` tag and `:latest` are re-pushed, so `sha-<short>` names
      # that commit's code, not one frozen image. A dispatch on a branch publishes a new `sha-` tag for that
      # unmerged commit; one on a `v*` tag re-pushes that tag's `sha-` and version tags. A later run of the
      # same ref cancels the earlier, and a refresh that cancels a push run still pushes that commit's
      # tags; WHAT IS LOST IS THE PUSH-ONLY STEPS, here the "Reject merge commits" tripwire for that push.
      # Runs on different refs (a `v*` tag, a branch dispatch) can still overlap and kill each other's
      # builder.
      - name: Build & push
        env:
          TAGS: ${{ steps.t.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder redextape-builder $ARGS \
            --build-arg COMMIT_HASH="$SHA" \
            --provenance=false --sbom=false \
            --push .
