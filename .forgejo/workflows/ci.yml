# Forgejo Actions CI for Redextape (self-hosted runner on git.daveynet.xyz).
# Adapted from the ws-sim setup for a Rust -> WASM static site + CLI (no server process).
#
# The Rust crates have landed; the web app has not. The `detect` job checks what exists and gates
# the rest, so `rust`/`rust-llvm`/`rust-slow` now run for real while `web` (and the `docker` job
# behind it) still SKIPS cleanly (green) until web/package.json lands — then activates
# automatically with no edits. See docs/ for the design spec.
#
# Forgejo specifics (vs GitHub): actions come from the code.forgejo.org mirror, toolchains are
# installed as steps (no fat preinstalled image), the image is built with `docker buildx build
# --push` against the host daemon, and the registry is the Forgejo instance (auth via PAT secrets
# REGISTRY_USER / REGISTRY_TOKEN). First run will need tuning (tool versions, runner networking).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE*"]
  pull_request:
    # `edited` is load-bearing, not decoration. Forgejo has NO `ready_for_review` event — its drafts
    # are a `WIP:` title prefix — so taking a PR out of draft surfaces as `edited`. Without it the
    # full jobs would not run until the next push, which is a window in which a draft-scoped PR could
    # be merged having never had a full run. The cost is that editing a non-draft PR's title or body
    # also re-runs the full jobs; that is the cheaper mistake.
    types: [opened, synchronize, reopened, edited]
    # NO `paths-ignore` HERE, unlike `push` above — that asymmetry is deliberate, not an oversight.
    # On `pull_request`, a path filter that matches the WHOLE diff means the workflow never runs at
    # all, which means no `ci / gate (pull_request)` status is ever posted. A required context with
    # no status never passes, and this repository has no bypass left for that: `enable_push` is off
    # and `scripts/land.sh` is gone. MEASURED: PR #6's head commit (23ffc978) is docs-only and has
    # ZERO commit statuses — under today's protection that PR would be unmergeable forever. Docs-only
    # PRs now pay a full CI run instead. That is wasteful, and it is the correct trade: a wasted run
    # is recoverable, a PR with no route to green is not.
    #
    # PR #6 is the only docs-only PR this repository has ever had, and that is the right population
    # to count — COMMITS are not. A `pull_request` path filter evaluates the whole `base...head`
    # diff, so docs-only commits on a mixed branch never trip it; only a wholly docs-only PR does.
    # (An earlier version of this comment cited a docs-only COMMIT count here, which measures
    # nothing about this filter.)
    #
    # The narrower fix — a `detect` output that path-gates the heavy jobs so a docs-only PR runs only
    # `detect`/`linear-history`/`gate` — is deliberately deferred: it needs `gate` to distinguish
    # "legitimately not required" from "skipped", which is a second judgement call and the exact
    # distinction this branch exists to get right.
    #
    # `push`'s `paths-ignore` above is untouched: a skipped push to `main` blocks
    # nothing, so it stays harmless — but the same `paths-ignore` also covers `tags: ["v*"]`. Once
    # `web/package.json` lands and the `docker` job activates, a `v*` tag on a docs-only diff would
    # skip this workflow entirely and never publish the release image. That gap is real; it is
    # deferred along with the narrower fix above, not solved by it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what exists so the pipeline no-ops until code lands, then auto-activates.
  detect:
    runs-on: docker
    outputs:
      has_rust: ${{ steps.c.outputs.has_rust }}
      has_web: ${{ steps.c.outputs.has_web }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: c
        run: |
          if [ -f Cargo.toml ]; then echo "has_rust=true" >> "$GITHUB_OUTPUT"; else echo "has_rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo "has_web=true" >> "$GITHUB_OUTPUT"; else echo "has_web=false" >> "$GITHUB_OUTPUT"; fi

  # LINEAR HISTORY on main. The local `merge.ff = only` that `scripts/setup-dev.sh` sets is a
  # convenience — it cannot bind anyone, and it does not survive a fresh clone. This is the gate: a
  # merge commit reaching main fails CI however it got there.
  #
  # Checks only the commits this push/PR actually adds, so it never re-litigates history that is
  # already on main.
  linear-history:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Reject merge commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # A PR compares against its base; a push compares against what the branch was before it.
          # A first push (or a null base) has no meaningful range, so fall back to the last commit.
          range=""
          if [ -n "${BASE:-}" ]; then
            range="$BASE..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "checking $range"
          merges=$(git log --merges --format='%h %s' "$range" || true)
          if [ -n "$merges" ]; then
            echo "error: merge commit(s) on main — rebase instead:" >&2
            echo "$merges" >&2
            exit 1
          fi
          echo "no merge commits in $range"

  # DRAFT pull requests only. Explicitly NOT a gate — the moment the PR leaves draft,
  # `rust`/`rust-llvm`/`rust-slow` run on every push and this job stops.
  #
  # WHAT THIS JOB ACTUALLY BUYS, corrected 2026-08-04 after measuring the live payload. It was
  # designed to scope against the PUSH INCREMENT — "a WIP push that touched one test does not pay for
  # the whole feature matrix". **It cannot.** `github.event.before` is EMPTY on Forgejo's
  # `synchronize` (measured on PR #8 run 60; `action` reads `synchronized`, and the `types:` filter
  # above matches it anyway). `base.sha` is the merge-base with `main`, so the payload offers no
  # per-push increment at all — `check-scoped.sh` always takes its whole-branch fallback, which
  # design §1.2 measured as narrowing anything on 3 of the last 40 commits.
  #
  # THE WALL-CLOCK SAVING IS LARGE, and a first version of this comment claimed it was ~zero.
  # MEASURED: a draft run is 72s (run 60) or 163s (run 59) — `rust-scoped` alone; a non-draft run is
  # 353s (run 63) — `max` over three jobs that overlap in full. **A 3.2-4.7m saving, not zero.**
  #
  # The wrong version reasoned "the jobs run in parallel, so wall = max, so draft ~= non-draft" from
  # an UNMEASURED guess that `rust-scoped` costs about what `rust` costs. It does not: `rust` also
  # runs `cargo llvm-cov nextest --workspace` on top of `check-all.sh --no-llvm`, and its 353s was
  # measured WHILE CONTENDING with two other jobs. `rust-scoped`'s worst case — full escalation to
  # `--no-llvm` — is 72s warm, consistent with the 50.1s `T_llvm_repeat` plus job overhead.
  #
  # `wall = max(jobs)` is right about scheduling and wrong about cost. Runner capacity is >= 3 in run
  # 63 specifically (its three heavy jobs span 19:59:35-20:05:28 together, so nothing queued there —
  # run 65 elsewhere queued twice, so capacity is a real constraint, just not this run's), but a job
  # with the box to ITSELF is far cheaper than the same job sharing it — the same contention lever
  # §6.5 credits for part of `rust-slow`'s PRE-to-POST mean shift (442s to 298s, untouched by any
  # commit on this branch) — see §6.5 for the counter-evidence that weakens this story too.
  #
  # So this job buys BOTH: ~6 CPU-minutes instead of ~12, and 3-5 wall-clock minutes on a draft push.
  # What it does not buy is a narrower diff. Restoring genuine per-push scoping would mean querying
  # the previous run's head SHA from the API — considered and rejected as too much machinery, and a
  # new network failure mode, for a job that is explicitly non-gating.
  #
  # The DRAFT BOOLEAN, not a `full-ci` label, decides. A label does not follow the head commit: push
  # after labelling and it still reads green while the full run describes an older tree — the
  # covers-less-than-it-claims failure this repository keeps finding. `draft` cannot go stale,
  # because leaving draft makes the full jobs run on every subsequent push.
  rust-scoped:
    needs: detect
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0     # check-scoped.sh needs merge-base for its fallback
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      # Restores the `rust` job's cache as a fallback, so a scoped run on a fresh branch starts warm
      # rather than compiling the workspace from scratch to run one test binary.
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-scoped-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-scoped-
            cargo-
      - name: Scoped check (NOT the merge gate)
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # `BEFORE` is ALWAYS empty here — measured, not assumed (PR #8 run 60). So this always
          # expands to the literal `none..<sha>`, whose base does not resolve, and the script always
          # takes its whole-branch fallback. That is safe (it checks MORE) and it is what the job
          # header above says it delivers. The `${BEFORE:-none}` form is kept rather than simplified
          # so that a future Forgejo which DOES populate `before` starts scoping narrowly with no
          # edit here — the same auto-activate shape `detect` uses for `web`.
          ./scripts/check-scoped.sh "${BEFORE:-none}..${SHA}"

  rust:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    #
    # IF FORGEJO EVER OMITS `draft`, THIS FAILS SAFE — worth stating because it is not obvious and
    # nothing else here says it. `null` is falsy, so `!github.event.pull_request.draft` is `true` and
    # all three full jobs RUN; `rust-scoped`'s trailing `&& ...draft` yields `null`, which coerces to
    # false, so the only thing skipped is the non-gating job. The ambiguous case over-runs rather
    # than under-runs. The `||` also short-circuits before `.draft` is touched at all on `push` and
    # `workflow_dispatch`. Whether Forgejo populates it is Task 6's first question.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker                    # -> catthehacker/ubuntu:act-latest (node+git+curl)
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml) + coverage tooling
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show                        # installs the toolchain + rustfmt/clippy from rust-toolchain.toml
          rustup component add llvm-tools-preview
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C "$HOME/.cargo/bin"
      # cargo-nextest is the runner scripts/check-all.sh requires (see its header for the
      # measurement). Prebuilt binary, same pattern as cargo-llvm-cov above — building it from
      # source would cost more than it saves. The pin and its checksum live in the script, which
      # `rust-llvm` runs too: both jobs invoke check-all.sh, so both need the same runner.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-
      - name: Feature matrix (non-LLVM configs)
        run: ./scripts/check-all.sh --no-llvm
      # `llvm-cov nextest`, not `llvm-cov --all-targets`, for the same reason the gate above switched
      # runners. Measured on this tree before the swap: 373.7s -> 164.6s (2.27x).
      #
      # It is NOT bit-identical coverage and saying so would be the easy lie: lines went 95.55% ->
      # 95.52%, i.e. 1397 -> 1407 uncovered of 31417. The 10 lines are the target set — `--all-targets`
      # instruments example targets, nextest's default does not. Both sit 15 points above the gate, so
      # the swap is safe; the delta is recorded rather than rounded away so that a future drop toward 80
      # is not misread as this change's fault.
      #
      # Neither runner covers DOCTESTS: `--all-targets` excludes them and nextest cannot run them at
      # all. That is unchanged by the swap, and `cargo llvm-cov --doctests` is nightly-only. The
      # doctest in `ty::show` is EXECUTED by scripts/check-all.sh above, just not instrumented here.
      - name: Test + coverage
        run: cargo llvm-cov nextest --workspace --fail-under-lines 80   # tune the gate as the code grows

  # The SLOW test tier: exhaustive sweeps marked `#[ignore = "slow tier: ..."]`, which `cargo test`
  # skips by default. In its own job for the same reason as `rust-llvm` — a multi-minute sweep must
  # never delay the fast signal — and NOT continue-on-error, because a job permitted to fail is not
  # coverage.
  #
  # This job is why the tier is worth having at all: `#[ignore]` tests rot when nothing runs them, and
  # the whole point of the tier is that developers do not run it locally on every commit.
  rust-slow:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-slow-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-slow-
      - name: Slow tier (exhaustive sweeps)
        run: ./scripts/check-slow.sh

  # The LLVM backend, in its own job so a cold or upstream-broken LLVM install never delays the fast
  # default-feature signal from `rust`. Deliberately NOT continue-on-error: a job permitted to fail
  # is not coverage.
  #
  # Caches /var/cache/apt/archives (the downloaded .deb payloads), NOT /usr/lib/llvm-22 itself, and
  # the install step always runs. Verified by pulling the actual apt.llvm.org .debs and running
  # `objdump -p` on llvm-config: it dynamically NEEDs libz3.so.4 and libzstd.so.1, which come from
  # the separate libz3-4/libzstd1 packages that dpkg installs to /usr/lib/x86_64-linux-gnu/, outside
  # /usr/lib/llvm-22. A directory-only cache that skips the whole install step on a hit would restore
  # an llvm-config that can't even execute (missing shared libs) on every run after the first, on a
  # fresh per-job container that never retains apt state. Caching the apt archive instead keeps
  # `apt-get install` unconditional and idempotent (so the runtime deps are always registered) while
  # still skipping the network download once the archive cache is warm.
  rust-llvm:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      # This job runs check-all.sh (below) WITHOUT --no-llvm, and that gate hard-fails when
      # cargo-nextest is missing. The install used to be inline in `rust` only, so this job failed on
      # every run from the day the fast tier moved to nextest; the cargo-llvm-* cache never covered
      # ~/.cargo/bin, so it could not arrive that way either.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      - name: Cache the LLVM 22 apt archive (avoids re-downloading ~300MB of .debs)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          key: apt-llvm-22-${{ runner.os }}
      - name: Install LLVM 22 (unconditional — apt skips re-downloading cached .debs, but always installs)
        run: |
          apt-get update && apt-get install -y --no-install-recommends lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22
          # `llvm.sh` does not install Polly, but LLVM 22 is BUILT with it — so `llvm-config
          # --libnames`, which llvm-sys's build script reads, lists Polly and llvm-sys emits
          # `cargo:rustc-link-lib=static=Polly`. Without the separate dev package the link fails with
          # "could not find native static library `Polly`". This does not reproduce on macOS, where
          # Homebrew's keg and its own llvm-config agree.
          apt-get install -y --no-install-recommends libpolly-22-dev
          "$LLVM_SYS_221_PREFIX/bin/llvm-config" --version   # fail loudly on a version mismatch
          # Prove the libraries llvm-config advertises are actually present, rather than discovering
          # it during a link several minutes later.
          for lib in $("$LLVM_SYS_221_PREFIX/bin/llvm-config" --libnames); do
            find "$LLVM_SYS_221_PREFIX/lib" /usr/lib -name "$lib" -print -quit | grep -q . \
              || { echo "llvm-config advertises $lib but it is not installed"; exit 1; }
          done
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-llvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-llvm-
      # --llvm-only, NOT the bare invocation this used to be. Bare `check-all.sh` is `--no-llvm` plus
      # the LLVM configs by construction, so this job re-ran every non-LLVM config the `rust` job had
      # already run. MEASURED at 50.1s (`T_llvm_repeat`, warm) — and the mechanism is not what the
      # first draft of this comment guessed. It said "a genuine rebuild rather than a warm no-op",
      # reasoning from the separate cache key (`cargo-llvm-*` vs `cargo-*`). The measurement says
      # otherwise: this job's cache is populated by its OWN previous run, which ran the full gauntlet,
      # so the repeated legs start warm and what they cost is fingerprint-checking every crate plus
      # re-running the whole test suite — not compilation. See
      # docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §2.2(a).
      #
      # The union invariant in check-all.sh is what makes splitting the job safe: --no-llvm there
      # plus --llvm-only here still covers every config, checkable with `check-all.sh --list`.
      - name: Feature matrix (LLVM configs only — `rust` covers the rest)
        run: ./scripts/check-all.sh --llvm-only
      - name: Optimization report (informational, never gating)
        run: cargo run --release --example opt_report -p redextape-native --features llvm

  # THE ONE REQUIRED STATUS CHECK. Nothing else in this workflow should be one, and the reason is
  # measured rather than stylistic.
  #
  # FORGEJO REPORTS A SKIPPED JOB AS `success` ON THE COMMIT-STATUS API. Measured on PR #8, run 59:
  # the draft gating skipped `rust`, `rust-llvm` and `rust-slow`, and all three published `success`
  # having never run, giving a combined state of `success` on a pull request that ran only `detect`,
  # `linear-history` and the explicitly non-gating `rust-scoped`. So a required context naming those
  # jobs directly cannot distinguish "ran and passed" from "did not run" — on ANY pull request, draft
  # or not. A `detect` emitting `has_rust=false` would do the same thing on a non-draft PR.
  #
  # `needs.<job>.result` IS A DIFFERENT SUBSYSTEM AND IT DOES MAKE THAT DISTINCTION — it reports
  # `skipped` as `skipped`. The `docker` job below has always relied on that correctly. This job is
  # the bridge: it reads the internal results and publishes ONE external context that a skip cannot
  # fake.
  #
  # `if: always()` IS LOAD-BEARING, NOT DEFENSIVE. Without it this job would itself be skipped
  # whenever its `needs` were skipped, and a skipped `gate` publishes `success` — reproducing the
  # exact hole it exists to close, one level up.
  #
  # See docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §4.4.
  gate:
    needs: [detect, linear-history, rust, rust-slow, rust-llvm, web]
    if: always()
    runs-on: docker
    steps:
      - name: Every gating job must have actually run and succeeded
        env:
          R_DETECT: ${{ needs.detect.result }}
          R_LINEAR: ${{ needs.linear-history.result }}
          R_RUST: ${{ needs.rust.result }}
          R_SLOW: ${{ needs.rust-slow.result }}
          R_LLVM: ${{ needs.rust-llvm.result }}
          R_WEB: ${{ needs.web.result }}
          HAS_RUST: ${{ needs.detect.outputs.has_rust }}
          HAS_WEB: ${{ needs.detect.outputs.has_web }}
        run: |
          set -eu
          echo "detect=$R_DETECT linear-history=$R_LINEAR has_rust=$HAS_RUST has_web=$HAS_WEB"
          echo "rust=$R_RUST rust-slow=$R_SLOW rust-llvm=$R_LLVM web=$R_WEB"

          fail=0
          require() {
            [ "$2" = success ] || { echo "error: $1 did not succeed — result: $2" >&2; fail=1; }
          }

          # `detect` is checked FIRST and unconditionally. Its outputs decide what else is required,
          # so trusting them while it was failing or skipped would make every check below vacuous.
          require detect "$R_DETECT"
          require linear-history "$R_LINEAR"

          # Only demand a tier when `detect` says there is something to build — the same "no-op
          # until the code lands, then auto-activate" contract `detect` gives the rest of the
          # workflow. `detect` is already required above, so an EMPTY (unset) HAS_RUST/HAS_WEB can
          # only mean a real absence, never a swallowed failure. That claim is about emptiness, not
          # about `false`: an explicit `false` is a normal, legitimate value and is exactly what the
          # `else` branches below are for — it is not the case the claim covers.
          if [ "$HAS_RUST" = true ]; then
            require rust "$R_RUST"
            require rust-slow "$R_SLOW"
            require rust-llvm "$R_LLVM"
          else
            echo "detect reports no Rust — the Rust tier is not required on this run"
          fi

          # `web` "auto-activates with no edits" the moment `web/package.json` lands (see `detect`'s
          # header comment) — this is what makes that activation actually gate anything instead of
          # silently leaving a failing `web` job out of a green `gate`.
          if [ "$HAS_WEB" = true ]; then
            require web "$R_WEB"
          else
            echo "detect reports no web — the web tier is not required on this run"
          fi

          if [ "$fail" -ne 0 ]; then
            echo >&2
            echo "THIS is the required check, not the jobs above it. A job that was SKIPPED" >&2
            echo "publishes 'success' to the status API, so requiring those directly would let a" >&2
            echo "draft PR — or any run where they were skipped — read green having never run." >&2
            echo "A draft PR is EXPECTED to fail here: take it out of draft to run the full tier." >&2
            exit 1
          fi
          echo "all gating jobs ran and passed"

  web:
    needs: detect
    if: needs.detect.outputs.has_web == 'true'
    runs-on: docker
    container:
      image: node:26-bookworm          # node + git present; JS actions work
    defaults:
      run:
        working-directory: web
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust + wasm-pack (the web build compiles the core crate to WASM)
        working-directory: ${{ github.workspace }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xzf - --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-
      - run: npm ci
      - name: Lint + format check
        run: npx biome ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (invokes wasm-pack, then the bundler)
        run: npm run build

  # Build + push the static-site image — only after rust + web pass, never on a PR.
  docker:
    needs: [detect, rust, rust-llvm, rust-slow, web]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.has_web == 'true'
      && needs.rust.result == 'success'
      && needs.rust-llvm.result == 'success'
      && needs.rust-slow.result == 'success'
      && needs.web.result == 'success'
    runs-on: docker                    # node:lts (runner default) + the host docker socket the runner mounts
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the docker CLI + buildx plugin
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.daveynet.xyz -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      # Build in an isolated docker-container builder, NOT the daemon's default driver, so CI never
      # touches the host image store — otherwise a build would drag the local :latest tag onto the new
      # image and What's-Up-Docker would miss the update. The named builder persists its BuildKit cache
      # across runs; `buildx create` isn't idempotent, so drop any stale container by name first
      # (`docker rm`, NOT `docker buildx rm`, which would also delete the cache volume).
      #
      # The name must stay unique per repo. ws-sim also builds on this runner, and both repos ran a
      # builder called `wud-safe` — the `docker rm -f` below is unconditional, so whichever `docker`
      # job started second would have destroyed the builder the first was mid-build in. That never
      # fired only because this job is gated off until web/package.json lands.
      - name: Set up an isolated buildx builder (keeps CI out of the host image store)
        run: |
          docker rm -f buildx_buildkit_redextape-wud0 >/dev/null 2>&1 || true
          docker buildx create --name redextape-wud --driver docker-container --use
      - name: Compute tags
        id: t
        env:                       # values via env, not inline ${{ }}, so a crafted ref name can't inject shell
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMG="forge.daveynet.xyz/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMG:sha-$(echo "$SHA" | cut -c1-7)"
          [ "$REF" = 'refs/heads/main' ] && TAGS="$TAGS,$IMG:latest"
          case "$REF" in
            refs/tags/v*) V="$REF_NAME"; TAGS="$TAGS,$IMG:${V#v}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # No registry cache export: Forgejo behind Cloudflare rejects large mode=max blobs (413). The
      # persistent redextape-wud builder keeps a local BuildKit cache instead — warm across runs. provenance
      # /sbom OFF so Forgejo registers a plain manifest. --push ships every tag in one pass.
      - name: Build & push
        env:
          TAGS: ${{ steps.t.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder redextape-wud $ARGS \
            --build-arg COMMIT_HASH="$SHA" \
            --provenance=false --sbom=false \
            --push .
