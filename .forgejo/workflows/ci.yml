# Forgejo Actions CI for Redextape (self-hosted runner on git.daveynet.xyz).
# Adapted from the ws-sim setup for a Rust -> WASM static site + CLI (no server process).
#
# The Rust crates have landed; the web app has not. The `detect` job checks what exists and gates
# the rest, so `rust`/`rust-llvm`/`rust-slow` now run for real while `web` (and the `docker` job
# behind it) still SKIPS cleanly (green) until web/package.json lands — then activates
# automatically with no edits. See docs/ for the design spec.
#
# Forgejo specifics (vs GitHub): actions come from the code.forgejo.org mirror, toolchains are
# installed as steps (no fat preinstalled image), the image is built with `docker buildx build
# --push` against the host daemon, and the registry is the Forgejo instance (auth via PAT secrets
# REGISTRY_USER / REGISTRY_TOKEN). First run will need tuning (tool versions, runner networking).

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE*"]
  pull_request:
    # `edited` is load-bearing, not decoration. Forgejo has NO `ready_for_review` event — its drafts
    # are a `WIP:` title prefix — so taking a PR out of draft surfaces as `edited`. Without it the
    # full jobs would not run until the next push, which is a window in which a draft-scoped PR could
    # be merged having never had a full run. The cost is that editing a non-draft PR's title or body
    # also re-runs the full jobs; that is the cheaper mistake.
    types: [opened, synchronize, reopened, edited]
    # NO `paths-ignore` HERE, unlike `push` above — that asymmetry is deliberate, not an oversight.
    # On `pull_request`, a path filter that matches the WHOLE diff means the workflow never runs at
    # all, which means no `ci / gate (pull_request)` status is ever posted. A required context with
    # no status never passes, and this repository has no bypass left for that: `enable_push` is off
    # and `scripts/land.sh` is gone. MEASURED: PR #6's head commit (23ffc978) is docs-only and has
    # ZERO commit statuses — under today's protection that PR would be unmergeable forever. Docs-only
    # PRs now pay a full CI run instead. That is wasteful, and it is the correct trade: a wasted run
    # is recoverable, a PR with no route to green is not.
    #
    # PR #6 is the only docs-only PR this repository has ever had, and that is the right population
    # to count — COMMITS are not. A `pull_request` path filter evaluates the whole `base...head`
    # diff, so docs-only commits on a mixed branch never trip it; only a wholly docs-only PR does.
    # (An earlier version of this comment cited a docs-only COMMIT count here, which measures
    # nothing about this filter.)
    #
    # The narrower fix — a `detect` output that path-gates the heavy jobs so a docs-only PR runs only
    # `detect`/`linear-history`/`gate` — is deliberately deferred: it needs `gate` to distinguish
    # "legitimately not required" from "skipped", which is a second judgement call and the exact
    # distinction this branch exists to get right.
    #
    # `push`'s `paths-ignore` above is untouched: a skipped push to `main` blocks
    # nothing, so it stays harmless — but the same `paths-ignore` also covers `tags: ["v*"]`. Once
    # `web/package.json` lands and the `docker` job activates, a `v*` tag on a docs-only diff would
    # skip this workflow entirely and never publish the release image. That gap is real; it is
    # deferred along with the narrower fix above, not solved by it.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect what exists so the pipeline no-ops until code lands, then auto-activates.
  detect:
    runs-on: docker
    outputs:
      has_rust: ${{ steps.c.outputs.has_rust }}
      has_web: ${{ steps.c.outputs.has_web }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: c
        run: |
          if [ -f Cargo.toml ]; then echo "has_rust=true" >> "$GITHUB_OUTPUT"; else echo "has_rust=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f web/package.json ]; then echo "has_web=true" >> "$GITHUB_OUTPUT"; else echo "has_web=false" >> "$GITHUB_OUTPUT"; fi

  # LINEAR HISTORY on main. The local `merge.ff = only` that `scripts/setup-dev.sh` sets is a
  # convenience — it cannot bind anyone, and it does not survive a fresh clone. This is the gate: a
  # merge commit reaching main fails CI however it got there.
  #
  # Checks only the commits a push to `main` actually adds, so it never re-litigates history that is
  # already there. **The merge-commit step is scoped to pushes on `main` and does NOT run on
  # `pull_request`** — under a squash merge a branch's own shape never reaches main, so checking it
  # there enforced a property main does not have. Since squash is now the only enabled merge style and
  # `enable_push` is off, that step cannot fire at all: it is a tripwire against a settings regression
  # nothing in this repository could otherwise detect. Its own comment carries the settings it read
  # and the measurement that prompted the narrowing.
  #
  # THE FOUR HYGIENE STEPS BELOW ARE UNCONDITIONAL AND ARE THE REASON THIS JOB IS STILL A REQUIRED
  # CONTEXT ON PULL REQUESTS — two for control bytes and two for `file:line` citations, each pair a
  # self-test followed by a scan. They are what a PR needs from this job; the merge check never was.
  # **This sentence said "the control-byte steps" until the citation branch's whole-branch review, and
  # the pair that falsified it was added by that same branch, into this same job.**
  linear-history:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # IN THIS JOB RATHER THAN A NEW ONE, DELIBERATELY. `gate` aggregates a fixed `needs:` list and
      # re-derives each result by name, so a new job means editing three places and changing the set
      # of checks branch protection sees. This job already means "repo hygiene that needs a full
      # checkout and nothing else", already runs on every push and PR, and is already gated — so the
      # check lands enforced without moving any of that. `scripts/check-text-bytes.sh` is the same
      # script `.pre-commit-config.yaml` runs, per the convention `scripts/check-all.sh` states: the
      # local and CI gates cannot drift because there is one implementation.
      # THE SELF-TEST RUNS FIRST AND IS NOT CEREMONY. This gate's first draft reported "clean"
      # against a planted NUL — it had the exact defect it exists to catch — and a scan that only
      # ever runs against a passing tree cannot tell the difference between working and broken.
      # `--self-test` plants a NUL, asserts the detector fires, and asserts an escaped `\x00` does
      # not. It calls the same `violations_in` the scan does, so it cannot drift into agreeing with
      # a broken scan.
      - name: Prove the control-byte detector still detects
        run: scripts/check-text-bytes.sh --self-test
      - name: Reject control bytes in tracked text files
        run: scripts/check-text-bytes.sh
      # THE CITATION GATE RIDES IN THIS JOB FOR THE REASONS THE COMMENT ABOVE ALREADY GIVES: it is
      # repo hygiene needing a full checkout and nothing else, this job already runs on every push and
      # PR and is already a required context, and a new job would mean editing `gate`'s `needs:` list
      # and changing the set of checks branch protection sees. It is unconditional and not skippable.
      # Same script as `.pre-commit-config.yaml` runs, so the local and CI gates cannot drift.
      # SELF-TEST FIRST, AND NOT AS CEREMONY. This gate's whole job is to report nothing on a tree
      # that already passes, so a green scan is indistinguishable from a broken detector. `--self-test`
      # plants a citation and asserts it is caught, asserts a symbol citation is not, and asserts an
      # escape-hatch marker is counted rather than hidden — all through the same `citation_lines` the
      # scan uses, so it cannot drift into agreeing with a broken scan.
      - name: Prove the citation detector still detects
        run: scripts/check-citations.sh --self-test
      - name: Reject file:line citations in tracked source
        run: scripts/check-citations.sh
      # ON PUSHES TO `main` ONLY, AND THE NARROWING IS THE POINT RATHER THAN A RELAXATION. This job's
      # heading states the goal exactly: "a merge commit REACHING MAIN fails CI however it got there."
      # Running it on `pull_request` checked a different artifact — the PR branch's own shape — which
      # under a squash merge never reaches main at all. The squash produces one commit whose parent is
      # main's tip, so a branch may carry any number of merge commits and main stays linear regardless.
      #
      # MEASURED, NOT HYPOTHETICAL: PR #38 (5d-ii-b) failed this job on six `--no-ff` commits that were
      # the joins of six parallel worktree lanes. Every one of them was discarded by the squash. The
      # only remedy the check offered was rebasing thirty-two commits — destroying the per-commit
      # reasoning this repository keeps deliberately — to satisfy a property main never observes.
      #
      # **THIS STEP IS A TRIPWIRE FOR A SETTINGS REGRESSION, NOT AN ACTIVE GATE — say so plainly rather
      # than let a future reader assume it is load-bearing.** As configured today it cannot fire, and
      # that is the intended state. The settings were READ, not assumed, when this was written (an
      # earlier draft asserted a squash-only restriction that did not exist at the time):
      #
      #   * Branch protection on `main`: `enable_push = false` with an EMPTY push whitelist. Nothing
      #     reaches `main` except a pull-request merge.
      #   * Merge styles: `allow_squash_merge` is the ONLY one enabled. `allow_merge_commits`,
      #     `allow_rebase`, `allow_rebase_explicit` and `allow_fast_forward_only_merge` are all off.
      #     A squash produces one commit whose parent is `main`'s tip, so it cannot be a merge commit.
      #
      # Those two facts together make a merge commit on `main` unreachable. The check is kept anyway
      # because **the coupling is invisible from inside the repository**: the guarantee lives in
      # Forgejo's settings, which no file here can see, and re-enabling `allow_fast_forward_only_merge`
      # in the web UI would silently restore the hole — a fast-forward lands a branch's commits
      # verbatim, and `main` is already an ancestor of every PR head. One `git log --merges` on pushes
      # to `main` is the whole cost of noticing that.
      #
      # It is the idiom `layout.ts`'s `splitLeaf` already uses for its own refusals: a backstop for a
      # caller that got there another way, labelled as a backstop rather than dressed up as the
      # mechanism. If this ever fires, the bug is in the repository settings, not in a branch.
      #
      # THE CONDITION NAMES `main` RATHER THAN RELYING ON `on.push.branches`. That list is `[main]`
      # today, so `github.event_name == 'push'` would be equivalent — and would silently stop being
      # equivalent the moment someone adds a branch to it. A `v*` tag push skips the step, correctly:
      # the tagged commit is already on `main` and was checked by (2) when it landed.
      #
      # The other two steps in this job are unconditional and must stay that way. They are the
      # control-byte gate, which has nothing to do with merge shape and everything to do with a defect
      # that made a whole source file invisible to `rg`.
      - name: Reject merge commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          # A push compares against what the branch was before it. A first push (or a null base) has no
          # meaningful range, so fall back to the last commit. The `pull_request` base is gone from this
          # step along with the event that supplied it.
          range=""
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          echo "checking $range"
          merges=$(git log --merges --format='%h %s' "$range" || true)
          if [ -n "$merges" ]; then
            echo "error: merge commit(s) reached main — squash-merge the PR instead:" >&2
            echo "$merges" >&2
            exit 1
          fi
          echo "no merge commits in $range"

  # DRAFT pull requests only. Explicitly NOT a gate — the moment the PR leaves draft,
  # `rust`/`rust-llvm`/`rust-slow` run on every push and this job stops.
  #
  # WHAT THIS JOB ACTUALLY BUYS, corrected 2026-08-04 after measuring the live payload. It was
  # designed to scope against the PUSH INCREMENT — "a WIP push that touched one test does not pay for
  # the whole feature matrix". **It cannot.** `github.event.before` is EMPTY on Forgejo's
  # `synchronize` (measured on PR #8 run 60; `action` reads `synchronized`, and the `types:` filter
  # above matches it anyway). `base.sha` is the merge-base with `main`, so the payload offers no
  # per-push increment at all — `check-scoped.sh` always takes its whole-branch fallback, which
  # design §1.2 measured as narrowing anything on 3 of the last 40 commits.
  #
  # THE WALL-CLOCK SAVING IS LARGE, and a first version of this comment claimed it was ~zero.
  # MEASURED: a draft run is 72s (run 60) or 163s (run 59) — `rust-scoped` alone; a non-draft run is
  # 353s (run 63) — `max` over three jobs that overlap in full. **A 3.2-4.7m saving, not zero.**
  #
  # The wrong version reasoned "the jobs run in parallel, so wall = max, so draft ~= non-draft" from
  # an UNMEASURED guess that `rust-scoped` costs about what `rust` costs. It does not: `rust` also
  # runs `cargo llvm-cov nextest --workspace` on top of `check-all.sh --no-llvm`, and its 353s was
  # measured WHILE CONTENDING with two other jobs. `rust-scoped`'s worst case — full escalation to
  # `--no-llvm` — is 72s warm, consistent with the 50.1s `T_llvm_repeat` plus job overhead.
  #
  # `wall = max(jobs)` is right about scheduling and wrong about cost. Runner capacity is >= 3 in run
  # 63 specifically (its three heavy jobs span 19:59:35-20:05:28 together, so nothing queued there —
  # run 65 elsewhere queued twice, so capacity is a real constraint, just not this run's), but a job
  # with the box to ITSELF is far cheaper than the same job sharing it — the same contention lever
  # §6.5 credits for part of `rust-slow`'s PRE-to-POST mean shift (442s to 298s, untouched by any
  # commit on this branch) — see §6.5 for the counter-evidence that weakens this story too.
  #
  # So this job buys BOTH: ~6 CPU-minutes instead of ~12, and 3-5 wall-clock minutes on a draft push.
  # What it does not buy is a narrower diff. Restoring genuine per-push scoping would mean querying
  # the previous run's head SHA from the API — considered and rejected as too much machinery, and a
  # new network failure mode, for a job that is explicitly non-gating.
  #
  # The DRAFT BOOLEAN, not a `full-ci` label, decides. A label does not follow the head commit: push
  # after labelling and it still reads green while the full run describes an older tree — the
  # covers-less-than-it-claims failure this repository keeps finding. `draft` cannot go stale,
  # because leaving draft makes the full jobs run on every subsequent push.
  rust-scoped:
    needs: detect
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.draft
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0     # check-scoped.sh needs merge-base for its fallback
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown   # check-scoped.sh escalates to check-all.sh, which has a base-tier wasm leg
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      # Restores the `rust` job's cache as a fallback, so a scoped run on a fresh branch starts warm
      # rather than compiling the workspace from scratch to run one test binary.
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-scoped-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-scoped-
            cargo-
      - name: Scoped check (NOT the merge gate)
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # `BEFORE` is ALWAYS empty here — measured, not assumed (PR #8 run 60). So this always
          # expands to the literal `none..<sha>`, whose base does not resolve, and the script always
          # takes its whole-branch fallback. That is safe (it checks MORE) and it is what the job
          # header above says it delivers. The `${BEFORE:-none}` form is kept rather than simplified
          # so that a future Forgejo which DOES populate `before` starts scoping narrowly with no
          # edit here — the same auto-activate shape `detect` uses for `web`.
          ./scripts/check-scoped.sh "${BEFORE:-none}..${SHA}"

  rust:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    #
    # IF FORGEJO EVER OMITS `draft`, THIS FAILS SAFE — worth stating because it is not obvious and
    # nothing else here says it. `null` is falsy, so `!github.event.pull_request.draft` is `true` and
    # all three full jobs RUN; `rust-scoped`'s trailing `&& ...draft` yields `null`, which coerces to
    # false, so the only thing skipped is the non-gating job. The ambiguous case over-runs rather
    # than under-runs. The `||` also short-circuits before `.draft` is touched at all on `push` and
    # `workflow_dispatch`. Whether Forgejo populates it is Task 6's first question.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker                    # -> catthehacker/ubuntu:act-latest (node+git+curl)
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml) + coverage tooling
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show                        # installs the toolchain + rustfmt/clippy from rust-toolchain.toml
          rustup target add wasm32-unknown-unknown   # scripts/check-all.sh's wasm leg checks against it
          rustup component add llvm-tools-preview
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar xzf - -C "$HOME/.cargo/bin"
      # cargo-nextest is the runner scripts/check-all.sh requires (see its header for the
      # measurement). Prebuilt binary, same pattern as cargo-llvm-cov above — building it from
      # source would cost more than it saves. The pin and its checksum live in the script, which
      # `rust-llvm` runs too: both jobs invoke check-all.sh, so both need the same runner.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-
      # BOTH opt-outs, not just --no-llvm. The browser tier joined the gate with the arena slice, and
      # a bare --no-llvm now selects it — which would make this job the only one needing Chrome while
      # `rust-browser` below already installs it. Same union-invariant split as LLVM, one tier wider.
      - name: Feature matrix (non-LLVM, non-browser configs)
        run: ./scripts/check-all.sh --no-llvm --no-browser
      # `llvm-cov nextest`, not `llvm-cov --all-targets`, for the same reason the gate above switched
      # runners. Measured on this tree before the swap: 373.7s -> 164.6s (2.27x).
      #
      # It is NOT bit-identical coverage and saying so would be the easy lie: lines went 95.55% ->
      # 95.52%, i.e. 1397 -> 1407 uncovered of 31417. The 10 lines are the target set — `--all-targets`
      # instruments example targets, nextest's default does not. Both sat 15 points above the gate
      # when the gate was 80; against today's 90 the margin is ~5.5. The swap is still safe, and the
      # delta is recorded rather than rounded away so that a future drop is not misread as this
      # change's fault. (Updated 2026-08-09 with the floor — the "15 points" reading was true of 80
      # and false the moment the floor moved.)
      #
      # Neither runner covers DOCTESTS: `--all-targets` excludes them and nextest cannot run them at
      # all. That is unchanged by the swap, and `cargo llvm-cov --doctests` is nightly-only. The
      # doctest in `ty::show` is EXECUTED by scripts/check-all.sh above, just not instrumented here.
      #
      # 90 IS CHOSEN, NOT DERIVED, and saying so is the point of this comment. Measured 2026-08-09:
      # 95.64% lines (15905 lines, 694 missed). A floor at `floor(measured) - 1` would be 94; 90 was
      # picked over that deliberately, to leave room for the workspace to take on hard-to-cover
      # surface — a new backend, platform-conditional code — without a floor bump in every such PR.
      #
      # The five points of headroom are the same KIND of slack that let the previous floor sit at 80
      # while the tree measured ~95, at half the size. That is a trade, not an oversight.
      #
      # The comment this replaces said `# tune the gate as the code grows`: an instruction with no
      # owner and no trigger, which is exactly why fifteen points accumulated unremarked. What
      # replaces it is a number with a date and a measurement beside it, so the next person to move
      # it can see what it was chosen against.
      - name: Test + coverage
        run: cargo llvm-cov nextest --workspace --fail-under-lines 90

  # The SLOW test tier: exhaustive sweeps marked `#[ignore = "slow tier: ..."]`, which `cargo test`
  # skips by default. In its own job for the same reason as `rust-llvm` — a multi-minute sweep must
  # never delay the fast signal — and NOT continue-on-error, because a job permitted to fail is not
  # coverage.
  #
  # This job is why the tier is worth having at all: `#[ignore]` tests rot when nothing runs them, and
  # the whole point of the tier is that developers do not run it locally on every commit.
  rust-slow:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-slow-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-slow-
      - name: Slow tier (exhaustive sweeps)
        run: ./scripts/check-slow.sh

  # The LLVM backend, in its own job so a cold or upstream-broken LLVM install never delays the fast
  # default-feature signal from `rust`. Deliberately NOT continue-on-error: a job permitted to fail
  # is not coverage.
  #
  # Caches /var/cache/apt/archives (the downloaded .deb payloads), NOT /usr/lib/llvm-22 itself, and
  # the install step always runs. Verified by pulling the actual apt.llvm.org .debs and running
  # `objdump -p` on llvm-config: it dynamically NEEDs libz3.so.4 and libzstd.so.1, which come from
  # the separate libz3-4/libzstd1 packages that dpkg installs to /usr/lib/x86_64-linux-gnu/, outside
  # /usr/lib/llvm-22. A directory-only cache that skips the whole install step on a hit would restore
  # an llvm-config that can't even execute (missing shared libs) on every run after the first, on a
  # fresh per-job container that never retains apt state. Caching the apt archive instead keeps
  # `apt-get install` unconditional and idempotent (so the runtime deps are always registered) while
  # still skipping the network download once the archive cache is warm.
  rust-llvm:
    needs: detect
    # Non-draft PRs, pushes and dispatches. A DRAFT PR gets `rust-scoped` instead — see that job for
    # why the draft boolean rather than a label decides. Note this runs on EVERY push to a non-draft
    # PR, so a green full run always describes the head commit.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      # This job runs check-all.sh (below) WITHOUT --no-llvm, and that gate hard-fails when
      # cargo-nextest is missing. The install used to be inline in `rust` only, so this job failed on
      # every run from the day the fast tier moved to nextest; the cargo-llvm-* cache never covered
      # ~/.cargo/bin, so it could not arrive that way either.
      - name: Install cargo-nextest (pinned + checksummed)
        run: ./scripts/install-nextest-ci.sh
      - name: Cache the LLVM 22 apt archive (avoids re-downloading ~300MB of .debs)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          # NO `runner.os` IN THE KEY, AND A restore-keys FALLBACK — corrected 2026-08-07 after this
          # cache went from hitting to missing without its key being edited. `runner.os` is a
          # CONSTANT in this repository (every job is `runs-on: docker`), so it discriminated nothing
          # while adding a component the runner can change underneath us; when its value moved, the
          # key moved with it and the previous cache became unreachable. These two apt caches were
          # also the only ones in this file without `restore-keys`, so they were the only ones with
          # no prefix fallback to soften exactly that. The bare prefix below still matches the older
          # `apt-llvm-22-Linux` and `apt-llvm-22-` spellings, so the existing cache is recoverable
          # rather than abandoned.
          key: apt-llvm-22
          restore-keys: apt-llvm-22
      - name: Install LLVM 22 (unconditional — apt skips re-downloading cached .debs, but always installs)
        run: |
          # WITHOUT THIS THE CACHE STEP ABOVE SAVES AN EMPTY DIRECTORY. Debian/Ubuntu container
          # images ship /etc/apt/apt.conf.d/docker-clean, whose DPkg::Post-Invoke deletes every .deb
          # from /var/cache/apt/archives the moment install finishes, leaving the post-job save
          # nothing to store.
          #
          # THIS IS NOT WHY THE CACHE MISSED, and the first version of this comment said it was.
          # **Corrected 2026-08-07:** it claimed this cache had probably never worked. Observed, it
          # had been hitting and then stopped without its key being edited — which docker-clean
          # cannot explain, since it would have prevented every hit rather than ending a run of them.
          # The miss is the key's, and is fixed at the cache step above.
          #
          # These two lines are still justified, on a distinction the wrong diagnosis skated over: A
          # CACHE HIT DOES NOT MEAN THE CACHE HAD CONTENTS. An empty archive restores as a hit and
          # saves no download at all, so "it was hitting" is consistent with it having been empty the
          # whole time. This makes the archive actually non-empty; the key fix makes it findable.
          # Whether the hits were previously carrying any .debs is still unmeasured.
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get update && apt-get install -y --no-install-recommends lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 22
          # `llvm.sh` does not install Polly, but LLVM 22 is BUILT with it — so `llvm-config
          # --libnames`, which llvm-sys's build script reads, lists Polly and llvm-sys emits
          # `cargo:rustc-link-lib=static=Polly`. Without the separate dev package the link fails with
          # "could not find native static library `Polly`". This does not reproduce on macOS, where
          # Homebrew's keg and its own llvm-config agree.
          apt-get install -y --no-install-recommends libpolly-22-dev
          "$LLVM_SYS_221_PREFIX/bin/llvm-config" --version   # fail loudly on a version mismatch
          # Prove the libraries llvm-config advertises are actually present, rather than discovering
          # it during a link several minutes later.
          for lib in $("$LLVM_SYS_221_PREFIX/bin/llvm-config" --libnames); do
            find "$LLVM_SYS_221_PREFIX/lib" /usr/lib -name "$lib" -print -quit | grep -q . \
              || { echo "llvm-config advertises $lib but it is not installed"; exit 1; }
          done
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-llvm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-llvm-
      # --llvm-only, NOT the bare invocation this used to be. Bare `check-all.sh` is `--no-llvm` plus
      # the LLVM configs by construction, so this job re-ran every non-LLVM config the `rust` job had
      # already run. MEASURED at 50.1s (`T_llvm_repeat`, warm) — and the mechanism is not what the
      # first draft of this comment guessed. It said "a genuine rebuild rather than a warm no-op",
      # reasoning from the separate cache key (`cargo-llvm-*` vs `cargo-*`). The measurement says
      # otherwise: this job's cache is populated by its OWN previous run, which ran the full gauntlet,
      # so the repeated legs start warm and what they cost is fingerprint-checking every crate plus
      # re-running the whole test suite — not compilation. See
      # docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §2.2(a).
      #
      # The union invariant in check-all.sh is what makes splitting the job safe: --no-llvm there
      # plus --llvm-only here still covers every config, checkable with `check-all.sh --list`.
      - name: Feature matrix (LLVM configs only — `rust` covers the rest)
        run: ./scripts/check-all.sh --llvm-only
      - name: Optimization report (informational, never gating)
        run: cargo run --release --example opt_report -p redextape-native --features llvm

  # THE BROWSER TIER, and it covers the one thing no other job in this workflow can reach.
  #
  # `rust`'s wasm legs prove the crates BUILD for wasm32. They cannot prove the boundary WORKS:
  # `#[wasm_bindgen]`'s generated glue and `serde-wasm-bindgen`'s marshalling only execute in a
  # browser, and `redextape-wasm` is deliberately structured so that every branch lives in
  # `session.rs` and is tested natively — which means a wasm-bindgen or serde-wasm-bindgen bump can
  # change what actually crosses the boundary with every other job in this file green. The wire shape
  # `web/` will code against (`{"Var":n}`, `{"Abs":[name, idx]}`) is asserted here and nowhere else.
  #
  # NOT continue-on-error, for the same reason `rust-slow` is not: a job permitted to fail is not
  # coverage. Its own cache key, like `rust-llvm`, so it does not evict the `rust` job's.
  #
  # `gate` REQUIRES THIS UNDER has_rust, NOT has_web, and that is permanent rather than provisional.
  # The boundary under test belongs to `redextape-wasm`; `web/` is a CONSUMER of it. Tying the job to
  # has_web would leave the boundary unguarded for exactly as long as it has no consumer — the window
  # in which it is easiest to break unnoticed — and landing PR 3c would not change which crate owns
  # the thing being tested. So this is not a gate to "update later" in that direction.
  #
  # WHAT WOULD LEGITIMATELY CHANGE IT IS COST, NOT CORRECTNESS. `has_rust` is `[ -f Cargo.toml ]`, so
  # it is true on every run here — an auto-activate switch, not a filter — and this job therefore runs
  # for changes that cannot possibly affect the boundary. The successor is the path-gated `detect`
  # output already deferred in this file's `pull_request` comment above.
  #
  # WHEN THAT LANDS, THE OBVIOUS PATH SET IS WRONG AND WOULD GUT THIS JOB. Scoping it to
  # `crates/redextape-wasm/**` misses what it primarily exists to catch: a wasm-bindgen or
  # serde-wasm-bindgen bump changing what actually crosses, which shows up in **`Cargo.lock`** and
  # nowhere else. `.cargo/config.toml` belongs in the set too — it carries the 8 MiB shadow-stack link
  # arg the depth cases were calibrated against — as does `crates/redextape-core/**`, since the view
  # models that cross the boundary are defined there rather than here.
  #
  # Caches /var/cache/apt/archives rather than the installed Chrome, and keeps `apt-get install`
  # unconditional — the same reasoning `rust-llvm` documents above: a directory cache that skips the
  # install would leave the shared libraries dpkg registers outside that directory missing on every
  # run after the first.
  rust-browser:
    needs: detect
    # Non-draft PRs, pushes and dispatches — matching the other full-tier jobs. A DRAFT PR gets
    # `rust-scoped` instead.
    if: >-
      needs.detect.outputs.has_rust == 'true'
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust (respects rust-toolchain.toml) + the wasm32 target
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown
      # NO cargo-nextest here, and that is deliberate rather than an omission: `--browser-only`
      # selects no `test` legs, so check-all.sh does not demand the runner. `rust` and `rust-llvm`
      # both install it because their tiers do have `test` rows.
      - name: Install wasm-pack (the browser leg drives the boundary through it)
        run: |
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xzf - --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version
      - name: Cache the Chrome apt archive (avoids re-downloading the .deb every run)
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/apt/archives
          # No `runner.os`, plus a restore-keys prefix — see the identical block in `rust-llvm` for
          # why: it is constant here, and a key with a volatile component and no fallback is what
          # turned that cache from a hit into a miss without anyone editing it.
          key: apt-chrome
          restore-keys: apt-chrome
      # GOOGLE CHROME SPECIFICALLY, not chromium. wasm-pack fetches a chromedriver matched to Chrome,
      # and this is also the browser the boundary's depth figures were measured against — a different
      # engine would be a different measurement wearing the same test's name.
      #
      # `google-chrome-stable` is the binary name the .deb installs, and check-all.sh's
      # `ensure_browser` probes that exact path: wasm-pack itself only looks for `google-chrome`,
      # which is the naming trap the script exists to absorb.
      - name: Install Google Chrome (unconditional — apt skips re-downloading a cached .deb)
        run: |
          # Keep the downloaded .debs so the cache step above has something to save — see the
          # identical block in `rust-llvm` for why: the base image's docker-clean deletes them
          # post-install, which makes the archive cache a permanent miss rather than a cold one.
          rm -f /etc/apt/apt.conf.d/docker-clean
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get update && apt-get install -y --no-install-recommends wget gnupg ca-certificates
          install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://dl.google.com/linux/linux_signing_key.pub \
            | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            > /etc/apt/sources.list.d/google-chrome.list
          apt-get update && apt-get install -y --no-install-recommends google-chrome-stable
          google-chrome-stable --version   # fail loudly here rather than inside wasm-pack
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-browser-
      # Chrome runs as root in this container, which it refuses to do sandboxed, and the container's
      # /dev/shm is too small for it. Both are handled by `crates/redextape-wasm/webdriver.json`
      # (`goog:chromeOptions.args`), which wasm-bindgen-test reads from the crate root — so this step
      # is the bare invocation, and the flags live with the crate they apply to rather than here.
      - name: Browser tier (the wasm boundary, in headless Chrome)
        run: ./scripts/check-all.sh --browser-only

  # THE ONE REQUIRED STATUS CHECK. Nothing else in this workflow should be one, and the reason is
  # measured rather than stylistic.
  #
  # FORGEJO REPORTS A SKIPPED JOB AS `success` ON THE COMMIT-STATUS API. Measured on PR #8, run 59:
  # the draft gating skipped `rust`, `rust-llvm` and `rust-slow`, and all three published `success`
  # having never run, giving a combined state of `success` on a pull request that ran only `detect`,
  # `linear-history` and the explicitly non-gating `rust-scoped`. So a required context naming those
  # jobs directly cannot distinguish "ran and passed" from "did not run" — on ANY pull request, draft
  # or not. A `detect` emitting `has_rust=false` would do the same thing on a non-draft PR.
  #
  # `needs.<job>.result` IS A DIFFERENT SUBSYSTEM AND IT DOES MAKE THAT DISTINCTION — it reports
  # `skipped` as `skipped`. The `docker` job below has always relied on that correctly. This job is
  # the bridge: it reads the internal results and publishes ONE external context that a skip cannot
  # fake.
  #
  # `if: always()` IS LOAD-BEARING, NOT DEFENSIVE. Without it this job would itself be skipped
  # whenever its `needs` were skipped, and a skipped `gate` publishes `success` — reproducing the
  # exact hole it exists to close, one level up.
  #
  # See docs/superpowers/specs/2026-08-04-ci-scope-filters-design.md §4.4.
  gate:
    needs: [detect, linear-history, rust, rust-slow, rust-llvm, rust-browser, web]
    if: always()
    runs-on: docker
    steps:
      - name: Every gating job must have actually run and succeeded
        env:
          R_DETECT: ${{ needs.detect.result }}
          R_LINEAR: ${{ needs.linear-history.result }}
          R_RUST: ${{ needs.rust.result }}
          R_SLOW: ${{ needs.rust-slow.result }}
          R_LLVM: ${{ needs.rust-llvm.result }}
          R_BROWSER: ${{ needs.rust-browser.result }}
          # R_WEB was briefly DROPPED here when R_BROWSER was added — replaced rather than joined —
          # and `set -u` turned the unbound reference on the echo below into a hard failure before
          # any `require` ran. Left as a note because the failure mode is the good one: the gate went
          # red and blocked the merge rather than quietly evaluating `web` as not-success, which is
          # what an unset-but-tolerated variable would have done.
          R_WEB: ${{ needs.web.result }}
          HAS_RUST: ${{ needs.detect.outputs.has_rust }}
          HAS_WEB: ${{ needs.detect.outputs.has_web }}
        run: |
          set -eu
          echo "detect=$R_DETECT linear-history=$R_LINEAR has_rust=$HAS_RUST has_web=$HAS_WEB"
          echo "rust=$R_RUST rust-slow=$R_SLOW rust-llvm=$R_LLVM rust-browser=$R_BROWSER web=$R_WEB"

          fail=0
          require() {
            [ "$2" = success ] || { echo "error: $1 did not succeed — result: $2" >&2; fail=1; }
          }

          # `detect` is checked FIRST and unconditionally. Its outputs decide what else is required,
          # so trusting them while it was failing or skipped would make every check below vacuous.
          require detect "$R_DETECT"
          require linear-history "$R_LINEAR"

          # Only demand a tier when `detect` says there is something to build — the same "no-op
          # until the code lands, then auto-activate" contract `detect` gives the rest of the
          # workflow. `detect` is already required above, so an EMPTY (unset) HAS_RUST/HAS_WEB can
          # only mean a real absence, never a swallowed failure. That claim is about emptiness, not
          # about `false`: an explicit `false` is a normal, legitimate value and is exactly what the
          # `else` branches below are for — it is not the case the claim covers.
          if [ "$HAS_RUST" = true ]; then
            require rust "$R_RUST"
            require rust-slow "$R_SLOW"
            require rust-llvm "$R_LLVM"
            # Gated on has_rust rather than has_web on purpose: the browser tier tests the RUST
            # crate's wasm boundary, which exists whether or not `web/` does. Tying it to has_web
            # would leave the boundary ungated for exactly as long as it has no consumer — the
            # window in which it is easiest to break unnoticed.
            require rust-browser "$R_BROWSER"
          else
            echo "detect reports no Rust — the Rust tier is not required on this run"
          fi

          # `web` "auto-activates with no edits" the moment `web/package.json` lands (see `detect`'s
          # header comment) — this is what makes that activation actually gate anything instead of
          # silently leaving a failing `web` job out of a green `gate`.
          if [ "$HAS_WEB" = true ]; then
            require web "$R_WEB"
          else
            echo "detect reports no web — the web tier is not required on this run"
          fi

          if [ "$fail" -ne 0 ]; then
            echo >&2
            echo "THIS is the required check, not the jobs above it. A job that was SKIPPED" >&2
            echo "publishes 'success' to the status API, so requiring those directly would let a" >&2
            echo "draft PR — or any run where they were skipped — read green having never run." >&2
            echo "A draft PR is EXPECTED to fail here: take it out of draft to run the full tier." >&2
            exit 1
          fi
          echo "all gating jobs ran and passed"

  web:
    needs: detect
    if: needs.detect.outputs.has_web == 'true'
    runs-on: docker
    container:
      image: node:26-bookworm          # node + git present; JS actions work
    defaults:
      run:
        working-directory: web
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust + wasm-pack (the web build compiles the core crate to WASM)
        working-directory: ${{ github.workspace }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar xzf - --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
      - name: Install pnpm
        run: npm install -g pnpm@11.20.0
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - run: pnpm install --frozen-lockfile
      - name: Build the WASM package (its .d.ts is what typecheck resolves `../pkg` against)
        run: pnpm run build:wasm
      - name: Install the Chromium Playwright needs
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint + format check
        run: pnpm exec biome ci --error-on-warnings
      - name: Typecheck
        run: pnpm run typecheck
      # `test:coverage`, not `test` — this is the web coverage gate. Thresholds live in
      # web/vite.config.ts beside the measurement that set them. NO SEPARATE JOB AND NO `gate` EDIT
      # IS NEEDED: `gate` already lists `web` in `needs` and already requires it under has_web, so a
      # threshold failure fails this job, which fails the required check. A separate coverage job
      # would re-install Rust, wasm-pack and Chromium for a signal this job already carries, and
      # would add a `require` line to `gate` that could be forgotten — which this file records
      # having happened once, when R_WEB was dropped.
      - name: Unit tests + coverage gate
        run: pnpm run test:coverage
      - name: Build the app
        run: pnpm run build:app

  # Build + push the static-site image — only after rust + web pass, never on a PR.
  docker:
    needs: [detect, rust, rust-llvm, rust-slow, web]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.detect.outputs.has_rust == 'true'
      && needs.detect.outputs.has_web == 'true'
      && needs.rust.result == 'success'
      && needs.rust-llvm.result == 'success'
      && needs.rust-slow.result == 'success'
      && needs.web.result == 'success'
    runs-on: docker                    # node:lts (runner default) + the host docker socket the runner mounts
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the docker CLI + buildx plugin
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.daveynet.xyz -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      # Build in an isolated docker-container builder, NOT the daemon's default driver, so CI never
      # touches the host image store. Building on the default driver would tag the new image into the
      # runner's own store, so the host's local `:latest` moves without anything being pulled — and any
      # deployment watching that tag then sees no change to act on. The named builder persists its
      # BuildKit cache across runs; `buildx create` isn't idempotent, so drop any stale container by
      # name first (`docker rm`, NOT `docker buildx rm`, which would also delete the cache volume).
      #
      # THE NAME MUST STAY UNIQUE PER REPO. ws-sim also builds on this runner, and both repos once ran
      # a builder called `wud-safe` — the `docker rm -f` below is unconditional, so whichever `docker`
      # job started second would have destroyed the builder the first was mid-build in. That never
      # fired only because this job was gated off until web/package.json landed.
      - name: Set up an isolated buildx builder (keeps CI out of the host image store)
        run: |
          docker rm -f buildx_buildkit_redextape-builder0 >/dev/null 2>&1 || true
          docker buildx create --name redextape-builder --driver docker-container --use
      - name: Compute tags
        id: t
        env:                       # values via env, not inline ${{ }}, so a crafted ref name can't inject shell
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMG="forge.daveynet.xyz/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMG:sha-$(echo "$SHA" | cut -c1-7)"
          [ "$REF" = 'refs/heads/main' ] && TAGS="$TAGS,$IMG:latest"
          case "$REF" in
            refs/tags/v*) V="$REF_NAME"; TAGS="$TAGS,$IMG:${V#v}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # No registry cache export: Forgejo behind Cloudflare rejects large mode=max blobs (413). The
      # persistent redextape-builder keeps a local BuildKit cache instead — warm across runs. provenance
      # /sbom OFF so Forgejo registers a plain manifest. --push ships every tag in one pass.
      - name: Build & push
        env:
          TAGS: ${{ steps.t.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder redextape-builder $ARGS \
            --build-arg COMMIT_HASH="$SHA" \
            --provenance=false --sbom=false \
            --push .
