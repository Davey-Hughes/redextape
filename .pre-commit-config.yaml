# Local pre-commit hooks mirroring the CI gates (.forgejo/workflows/ci.yml). Install with:
#   pre-commit install
# Hooks scoped by `files:` only fire when matching files are staged: Rust hooks run on *.rs; web hooks
# run on the web/ sources. The `always_run` hooks fire on every commit.
# `web typecheck` needs `pkg/` and `pkg-lsp/`, neither checked in (see .gitignore). A fresh clone runs
#   cd web && pnpm install && pnpm run build:wasm && pnpm run build:lsp-wasm
# once before committing any TypeScript.
repos:
  - repo: local
    hooks:
      # NOT scoped by `files:`, unlike every SCOPED hook below it, and that is the point: the byte
      # this rejects makes a file invisible to search, so a gate that only fires when a matching path
      # is staged would miss it arriving in a path nobody thought to list.
      #
      # It walks `git ls-files`: cheap enough to run always; not free.
      #
      # `--self-test` FIRST, then the scan — the same order CI uses, and for the same reason: a scan of
      # a clean tree proves nothing on its own.
      - id: check-text-bytes
        name: no control bytes in tracked text
        entry: bash -c 'scripts/check-text-bytes.sh --self-test && scripts/check-text-bytes.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR THE SAME REASON AS THE HOOK ABOVE, AND WITH ITS OWN EVIDENCE. A `file:line`
      # citation rots because something is inserted ABOVE its target, and the file that moves is
      # almost never the file being committed — so a rule scoped by staged path would miss the
      # citation arriving in a path nobody thought to list. It walks `git ls-files` instead.
      # `--self-test` first, then the scan, for the reason `check-text-bytes` states: a gate that only
      # ever runs against a passing tree cannot tell you it still works.
      - id: check-citations
        name: no file:line citations in tracked source
        entry: bash -c 'scripts/check-citations.sh --self-test && scripts/check-citations.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR THE CITATION GATE'S REASON, ARRIVING FROM THE OTHER END. That gate catches a
      # pointer whose target MOVED DOWN THE FILE; this one catches a symbol that moved to a DIFFERENT
      # FILE, and the file that goes wrong is even further from the commit: an extraction changes two
      # files, while the citations that rot are in files it never touched. A `files:`-scoped rule would
      # fire on exactly the commits that do not need it.
      # `--self-test` first, then the scan, for the reason `check-text-bytes` states: a gate that only
      # ever runs against a passing tree cannot tell you it still works.
      - id: check-attributions
        name: symbol citations name the file that declares the symbol
        entry: bash -c 'scripts/check-attributions.sh --self-test && scripts/check-attributions.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR A SHARPER VERSION OF THE REASON THE HOOKS ABOVE GIVE, and the sharpening is the
      # whole argument. A README figure goes stale because a DIFFERENT file changed: one line added to
      # `grammars/tree-sitter-redextape-lambda/grammar.js` falsifies that grammar's README and the asm
      # and TM ones, which cite λ's line count for comparison. The file that goes wrong is never the
      # file being staged, so a `files:`-scoped rule would fire on exactly the commits that do not need
      # it and stay silent on the ones that do. It reads only the files its table names rather than
      # walking `git ls-files`.
      # `--self-test` first, then the scan, for the reason `check-text-bytes` states: a gate that only
      # ever runs against a passing tree cannot tell you it still works.
      - id: check-doc-figures
        name: documented figures match the tree
        entry: bash -c 'scripts/check-doc-figures.sh --self-test && scripts/check-doc-figures.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED, like the gates above it and unlike `check-lua` below, and for the sharpest
      # version of the reason: a shared region goes stale because a DIFFERENT file changed — someone
      # edits `grammars/shared/<name>.md` and the four copies of it are now wrong, in four paths the
      # commit never touched. A `files:`-scoped rule would fire on exactly the commits that do not
      # need it.
      # It is cheap because it greps only the tracked `*.md` files for a marker rather than reading
      # every tracked file.
      - id: check-shared-docs
        name: shared doc regions match their source
        entry: bash -c 'scripts/check-shared-docs.sh --self-test && scripts/check-shared-docs.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR THE SIBLINGS' REASON: a colour literal can arrive in any web source, and the file that
      # carries it is not necessarily one this commit names. Self-test first, then the scan.
      - id: check-colours
        name: no colour literals outside the palette
        entry: bash -c 'scripts/check-colours.sh --self-test && scripts/check-colours.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED, like every gate above it, and for a reason this one can state exactly: the file
      # that goes stale is `grammars/<g>/<g>.wasm` and the file being committed is
      # `grammars/<g>/grammar.js` or `src/parser.c`. `check-lua` below is already scoped to
      # `^grammars/.*/src/parser\.c$` for its own reasons, which is the same input set seen from the
      # other side; this hook stays unscoped so that a hand-edited artefact is caught too, which is
      # the whole point of its second hash. Self-test first, then the scan.
      - id: check-grammar-wasm
        name: committed grammar .wasm match their parser.c
        entry: bash -c 'scripts/check-grammar-wasm.sh --self-test && scripts/check-grammar-wasm.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR THE SIBLINGS' REASON: what makes `web/src/third-party-licences.json` stale is a lockfile, an
      # import or a dependency's own licence file, not the file being committed. It needs `web/node_modules` and
      # `cargo`, as the generator does. Self-test first, then the check.
      - id: check-licences
        name: third-party licences match what the site ships
        entry: bash -c 'scripts/check-licences.sh --self-test && scripts/check-licences.sh'
        language: system
        always_run: true
        pass_filenames: false
      # SCOPED, unlike the hooks above it: what it checks is a property of the tracked Lua, the grammars'
      # `src/parser.c` and `crates/redextape-lsp/src/language.rs`, and `files:` names only the first two,
      # so a commit touching only `language.rs` is checked by CI alone.
      - id: check-lua
        name: lua parses and parser names agree
        entry: bash -c 'scripts/check-lua.sh --self-test && scripts/check-lua.sh'
        language: system
        files: (\.lua$|^grammars/.*/src/parser\.c$)
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
      - id: biome-ci
        name: biome ci
        entry: bash -c 'cd web && pnpm exec biome ci --error-on-warnings'
        language: system
        files: ^web/.*\.(js|ts|jsx|tsx|json|css)$
        pass_filenames: false
      - id: web-typecheck
        name: web typecheck
        entry: bash -c 'cd web && pnpm run typecheck'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
