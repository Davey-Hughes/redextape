# Local pre-commit hooks mirroring the CI gates (.forgejo/workflows/ci.yml). Install with:
#   pre-commit install
# Hooks only fire when matching files are staged. Rust hooks run on *.rs; web hooks run on the
# web/ sources — both now fire for real, since crates/ and web/ both exist.
# `web typecheck` needs `pkg/`, which is not checked in (see .gitignore). A fresh clone runs
#   cd web && pnpm install && pnpm run build:wasm
# once before committing any TypeScript.
repos:
  - repo: local
    hooks:
      # NOT scoped by `files:`, unlike every SCOPED hook below it, and that is the point: the byte
      # this rejects makes a file invisible to search, so a gate that only fires when a matching path
      # is staged would miss it arriving in a path nobody thought to list. The citation hook below is
      # unscoped for its own version of the same reason, so "every hook below it" was falsified by the
      # hook this repo added directly underneath — the four `files:`-scoped hooks are the comparison.
      #
      # It walks `git ls-files` and costs the better part of a second — 574-594 ms over five runs at
      # the citation branch's close, with two other observers at 583-589 and 567-587. **THIS SENTENCE
      # HAS NOW BEEN WRONG TWICE, IN OPPOSITE DIRECTIONS, AND THE SECOND TIME WAS THE FIX FOR THE
      # FIRST.** It read "milliseconds" until the citation gate's review measured it, and the commit
      # whose entire subject line was that the adjective was two orders out replaced it with "a
      # quarter-second — measured 583-589 ms", which contradicts itself inside one clause. The
      # quarter-second is the CITATION gate below (255-269 ms at the same close); this one is more
      # than twice that. Cheap enough to run always; not free.
      #
      # `--self-test` FIRST, then the scan — the same order CI uses, and for the same reason: this
      # gate's first draft passed against a planted NUL, so a scan of a clean tree proves nothing on
      # its own.
      - id: check-text-bytes
        name: no control bytes in tracked text
        entry: bash -c 'scripts/check-text-bytes.sh --self-test && scripts/check-text-bytes.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR THE SAME REASON AS THE HOOK ABOVE, AND WITH ITS OWN EVIDENCE. A `file:line`
      # citation rots because something is inserted ABOVE its target, and the file that moves is
      # almost never the file being committed — so a rule scoped by staged path would miss the
      # citation arriving in a path nobody thought to list. It walks `git ls-files` instead, and the
      # cost was MEASURED rather than assumed: self-test plus scan is ~250 ms over 258 files, after
      # the per-file `printf | grep` filters were replaced with bash matching (~975 ms before). The
      # tally reconciliation added a second `git ls-files` walk, worth about +35 ms — measured
      # INTERLEAVED against the previous version on the same machine, because absolute figures here
      # vary by more than the change does and a single before/after pair would have measured load.
      # `--self-test` first, then the scan, for the reason `check-text-bytes` states: a gate that only
      # ever runs against a passing tree cannot tell you it still works.
      - id: check-citations
        name: no file:line citations in tracked source
        entry: bash -c 'scripts/check-citations.sh --self-test && scripts/check-citations.sh'
        language: system
        always_run: true
        pass_filenames: false
      # UNSCOPED FOR A SHARPER VERSION OF THE REASON THE TWO HOOKS ABOVE GIVE, and the sharpening is
      # the whole argument. A README figure goes stale because a DIFFERENT file changed: one line
      # added to `grammars/tree-sitter-redextape-lambda/grammar.js` falsifies both that grammar's
      # README and the TM one, which cites λ's line count for comparison. The file that goes wrong is
      # never the file being staged, so a `files:`-scoped rule would fire on exactly the commits that
      # do not need it and stay silent on the ones that do.
      # MEASURED, NOT ASSUMED, per the two hooks above: self-test plus scan is 142-159 ms over five
      # runs and the scan alone is 106-111 ms — cheaper than either, because it reads four READMEs
      # rather than walking `git ls-files`.
      # **THOSE FIGURES READ "136-143 ms" AND "THREE READMEs" UNTIL THE ROOT README GAINED ITS ROWS**,
      # one branch later, which is this comment falsifying itself the same way the README's hook count
      # did — a number describing a gate, invalidated by the gate growing. Re-measured rather than
      # scaled: the sibling hooks cost 919 ms and 411 ms on the same machine in the same minute, so
      # "cheaper than either" was re-established rather than carried forward on the old figures.
      # `--self-test` first, then the scan, for the reason `check-text-bytes` states: a gate that only
      # ever runs against a passing tree cannot tell you it still works.
      - id: check-doc-figures
        name: documented figures match the tree
        entry: bash -c 'scripts/check-doc-figures.sh --self-test && scripts/check-doc-figures.sh'
        language: system
        always_run: true
        pass_filenames: false
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
      - id: biome-ci
        name: biome ci
        entry: bash -c 'cd web && pnpm exec biome ci --error-on-warnings'
        language: system
        files: ^web/.*\.(js|ts|jsx|tsx|json|css)$
        pass_filenames: false
      - id: web-typecheck
        name: web typecheck
        entry: bash -c 'cd web && pnpm run typecheck'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false
