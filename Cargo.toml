[workspace]
resolver = "3"
members = [
    "crates/redextape-cli",
    "crates/redextape-core",
    "crates/redextape-grammar-check",
    "crates/redextape-lsp",
    "crates/redextape-lsp-wasm",
    "crates/redextape-native",
    "crates/redextape-native-rt",
    "crates/redextape-test-support",
    "crates/redextape-wasm",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://git.daveynet.xyz/davey/redextape"

[workspace.lints.clippy]
# Deny is enforced by CI (`-D warnings`); keep the crate clippy-clean.
all = "warn"
# No library path may panic: every failure is a `Diagnostic`, a `RuntimeError`, or a typed `Err`.
# These five make that rule mechanical FOR THOSE FIVE CONSTRUCTS, catching `unwrap`/`expect`/
# `panic!`/`todo!`/`unimplemented!` in library code.
# `assert!` and `unreachable!` are also panics and remain outside it: no clippy lint bans `assert!`
# at all, so the rule is not fully mechanical. Several `pub`-reachable library paths panic via
# `assert!`/`unreachable!` on purpose rather than threading a typed error through a hot or purely
# internal path; `crates/redextape-core/src/lambda/term.rs`'s `shift` is not the only one, but it
# carries the fullest reasoning of the class, documented at that site — full compliance there would
# require threading `Result` through a hot recursive path into `redextape-wasm` and `redextape-native`.
# Test code panics on purpose and is exempted in `clippy.toml` — read that file before adding a test
# that trips one of these.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# `pedantic` is enabled AS WRITTEN — no lint in it is allowed workspace-wide. A production warning is
# resolved on its merits rather than silenced here; see
# docs/superpowers/specs/2026-08-10-clippy-pedantic-design.md for the warnings and their disposition.
#
# `priority = -1` is not load-bearing today (the five restriction lints above are in neither `all`
# nor `pedantic`, so nothing conflicts) — it is here so that adding a per-lint `allow` later WORKS
# rather than erroring. That matters more than usual: rust-toolchain.toml tracks unpinned `stable`,
# and a new stable can add a pedantic lint that reddens CI with no code change. This field is the
# one-line remedy.
pedantic = { level = "warn", priority = -1 }

# Dev and test builds keep line tables and drop the rest of the DWARF — types, variable locations,
# and the string table naming them. Panics and backtraces still resolve to file, line and column,
# which is the property this repository cannot give up: its tests ARE its primary diagnostic and
# cannot afford backtraces that name a function and no position. `debug = 0` drops the file, line and
# column, which is why the cheaper setting is not the one here.
#
# COVERAGE IS UNAFFECTED: `llvm-cov` reads the maps `-C instrument-coverage` embeds into the
# binary, not DWARF.
#
# For a debugger session that needs variable inspection, override per invocation:
#   CARGO_PROFILE_DEV_DEBUG=2 cargo test -p <crate>
#
# The reason for this setting is cache size, at no build-time cost: 281 MiB less to upload and 281 MiB
# less to restore than cargo's default `debug = 2`, paid five times each way, because CI keeps five
# separate cargo caches over five separate copies of `target`.
#
# The other half of that CI bulk — the incremental-compilation cache — is deliberately NOT dropped
# here. It is set in the workflow instead, because disabling it costs local rebuild time that a
# runner never pays back; the reasoning is written at that setting.
[profile.dev]
debug = "line-tables-only"
