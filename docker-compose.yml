# Redextape — a static browser app served by nginx. Bring it up with:  docker compose up -d
# Then open http://<host>:8085 . Front it with your reverse proxy / Cloudflare Tunnel for HTTPS.
#
# To build from this repo instead of pulling the published image, replace the `image:` line with:
#   build: .
services:
  redextape:
    image: forge.daveynet.xyz/davey/redextape:latest
    container_name: redextape
    restart: unless-stopped
    ports:
      - "8085:80" # host 8085 -> container 80. Point your reverse proxy here.
    # NO AUTO-UPDATE LABELS HERE, DELIBERATELY. CI publishes `:latest` on every push to `main` and
    # `:sha-<short>` on every build, so an image-update watcher has something to follow — but which
    # watcher, and whether you want unattended pulls at all, is a property of the deployment rather
    # than of this repo. Add whatever labels your own stack expects.
