# Static serving for the Redextape single-page app.
# Modern nginx (the alpine image) already maps .wasm -> application/wasm via mime.types, which is
# required for WebAssembly streaming compilation — no custom types block needed.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json image/svg+xml;

    # Hashed build assets (Vite emits content-hashed filenames) — cache hard and immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA entrypoint — never cache the HTML so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
